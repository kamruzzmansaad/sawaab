 {id:'hkalimatan',d:'azim',col:'bukhari',n:7563,book:'tawhid',nar:'abuhurayra',g:'sahih',also:[['bukhari',6406],['muslim',2694]],
  ar:`كَلِمَتَانِ حَبِيبَتَانِ إِلَى الرَّحْمَنِ، خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي الْمِيزَانِ: سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ`,
  tx:{en:`The Prophet ﷺ said: “Two words are beloved to the Most Merciful, light on the tongue and heavy on the scale: SubhanAllahi wa bihamdihi, SubhanAllahil-‘Azim.”`,
   bn:`নবী ﷺ বলেছেন: “দুটি বাক্য দয়াময় আল্লাহর কাছে প্রিয়, জিহ্বায় হালকা এবং মীযানে ভারী: সুবহানাল্লাহি ওয়া বিহামদিহি, সুবহানাল্লাহিল আযীম।”`,
   ur:`نبی ﷺ نے فرمایا: ”دو کلمے رحمٰن کو محبوب ہیں، زبان پر ہلکے اور میزان میں بھاری ہیں: سبحان اللہ وبحمدہ، سبحان اللہ العظیم۔“`,
   hi:`नबी ﷺ ने फ़रमाया: “दो कलिमे रहमान को प्यारे हैं, ज़बान पर हल्के और तराज़ू में भारी हैं: सुब्हानल्लाहि व बिहम्दिही, सुब्हानल्लाहिल अज़ीम।”`,
   fil:`Sinabi ng Propeta ﷺ: “May dalawang salita na minamahal ng Pinakamaawain, magaan sa dila at mabigat sa timbangan: SubhanAllahi wa bihamdihi, SubhanAllahil-‘Azim.”`,
   pt:`O Profeta ﷺ disse: “Duas palavras são amadas pelo Misericordioso, leves na língua e pesadas na balança: SubhanAllahi wa bihamdihi, SubhanAllahil-‘Azim.”`,
   es:`El Profeta ﷺ dijo: “Dos palabras son amadas por el Misericordioso, livianas en la lengua y pesadas en la balanza: SubhanAllahi wa bihamdihi, SubhanAllahil-‘Azim.”`,
   zh:`先知ﷺ说：“有两句话为至仁主所喜爱，说起来轻，在天秤上重：赞颂真主超绝并赞美祂，赞颂伟大的真主。”`,
   ja:`預言者ﷺは言った。「慈悲深き御方に愛され、舌に軽く、秤に重い二つの言葉がある。スブハーナッラーヒ・ワ・ビハムディヒ、スブハーナッラーヒル・アズィーム。」`,
   id:`Nabi ﷺ bersabda: “Dua kalimat yang dicintai oleh Ar-Rahman, ringan di lisan dan berat di timbangan: Subhanallahi wa bihamdihi, Subhanallahil ‘Azhim.”`}},
 {id:'hzabad',d:'bihamdihi',col:'bukhari',n:6405,book:'dawat',nar:'abuhurayra',g:'sahih',also:[['muslim',2691]],
  ar:`مَنْ قَالَ سُبْحَانَ اللَّهِ وَبِحَمْدِهِ فِي يَوْمٍ مِائَةَ مَرَّةٍ، حُطَّتْ خَطَايَاهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ الْبَحْرِ`,
  tx:{en:`The Messenger of Allah ﷺ said: “Whoever says SubhanAllahi wa bihamdihi a hundred times in a day, his sins are wiped away even if they are like the foam of the sea.”`,
   bn:`রাসূলুল্লাহ ﷺ বলেছেন: “যে ব্যক্তি দিনে একশবার ‘সুবহানাল্লাহি ওয়া বিহামদিহি’ বলে, তার গুনাহ সমুদ্রের ফেনার সমান হলেও মুছে দেওয়া হয়।”`,
   ur:`رسول اللہ ﷺ نے فرمایا: ”جو شخص دن میں سو بار سبحان اللہ وبحمدہ کہے، اس کے گناہ مٹا دیے جاتے ہیں اگرچہ سمندر کی جھاگ کے برابر ہوں۔“`,
   hi:`रसूलुल्लाह ﷺ ने फ़रमाया: “जो व्यक्ति दिन में सौ बार ‘सुब्हानल्लाहि व बिहम्दिही’ कहे, उसके गुनाह मिटा दिए जाते हैं चाहे वे समुद्र के झाग के बराबर हों।”`,
   fil:`Sinabi ng Sugo ng Allah ﷺ: “Sinumang magsabi ng SubhanAllahi wa bihamdihi nang isandaang beses sa isang araw, buburahin ang kanyang mga kasalanan kahit ito ay tulad ng bula ng dagat.”`,
   pt:`O Mensageiro de Allah ﷺ disse: “Quem disser SubhanAllahi wa bihamdihi cem vezes por dia terá seus pecados apagados, mesmo que sejam como a espuma do mar.”`,
   es:`El Mensajero de Allah ﷺ dijo: “Quien diga SubhanAllahi wa bihamdihi cien veces al día, se le borran sus pecados aunque sean como la espuma del mar.”`,
   zh:`安拉的使者ﷺ说：“谁每天念‘赞颂真主超绝，并赞美祂’一百遍，他的罪过即使多如海沫也会被抹去。”`,
   ja:`アッラーの使徒ﷺは言った。「一日に百回スブハーナッラーヒ・ワ・ビハムディヒと唱える者は、その罪が海の泡のように多くとも消し去られる。」`,
   id:`Rasulullah ﷺ bersabda: “Barang siapa mengucapkan Subhanallahi wa bihamdihi seratus kali dalam sehari, dihapuskan kesalahannya walaupun sebanyak buih di lautan.”`}},
 {id:'h1000',d:'subhan',col:'muslim',n:2698,book:'dhikr',nar:'saad',g:'sahih',also:[],
  ar:`أَيَعْجِزُ أَحَدُكُمْ أَنْ يَكْسِبَ كُلَّ يَوْمٍ أَلْفَ حَسَنَةٍ … يُسَبِّحُ مِائَةَ تَسْبِيحَةٍ فَيُكْتَبُ لَهُ أَلْفُ حَسَنَةٍ أَوْ يُحَطُّ عَنْهُ أَلْفُ خَطِيئَةٍ`,
  tx:{en:`We were with the Messenger of Allah ﷺ and he said: “Is any of you unable to earn a thousand good deeds every day?” Someone asked how. He said: “He glorifies Allah a hundred times, and a thousand good deeds are written for him, or a thousand sins are erased from him.”`,
   bn:`আমরা রাসূলুল্লাহ ﷺ-এর কাছে ছিলাম। তিনি বললেন: “তোমাদের কেউ কি প্রতিদিন এক হাজার নেকি অর্জন করতে অক্ষম?” একজন জিজ্ঞেস করলেন, কীভাবে? তিনি বললেন: “সে একশবার সুবহানাল্লাহ বলবে; তার জন্য এক হাজার নেকি লেখা হবে, অথবা তার এক হাজার গুনাহ মুছে দেওয়া হবে।”`,
   ur:`ہم رسول اللہ ﷺ کے پاس تھے، آپ نے فرمایا: ”کیا تم میں سے کوئی ہر روز ایک ہزار نیکیاں کمانے سے عاجز ہے؟“ پوچھا گیا: کیسے؟ فرمایا: ”وہ سو بار سبحان اللہ کہے، اس کے لیے ہزار نیکیاں لکھی جائیں گی یا اس کے ہزار گناہ مٹا دیے جائیں گے۔“`,
   hi:`हम रसूलुल्लाह ﷺ के पास थे, आपने फ़रमाया: “क्या तुममें से कोई रोज़ाना एक हज़ार नेकियाँ कमाने से असमर्थ है?” पूछा गया: कैसे? फ़रमाया: “वह सौ बार सुब्हानल्लाह कहे; उसके लिए एक हज़ार नेकियाँ लिखी जाएँगी या उसके एक हज़ार गुनाह मिटा दिए जाएँगे।”`,
   fil:`Kami ay kasama ng Sugo ng Allah ﷺ at sinabi niya: “May isa ba sa inyo na hindi kayang kumita ng isang libong mabuting gawa araw-araw?” Tinanong kung paano. Sabi niya: “Luluwalhatiin niya ang Allah nang isandaang beses, at isusulat para sa kanya ang isang libong mabuting gawa, o buburahin sa kanya ang isang libong kasalanan.”`,
   pt:`Estávamos com o Mensageiro de Allah ﷺ e ele disse: “Algum de vocês é incapaz de ganhar mil boas ações por dia?” Perguntaram como. Ele disse: “Que glorifique Allah cem vezes; mil boas ações serão registradas para ele, ou mil pecados serão apagados dele.”`,
   es:`Estábamos con el Mensajero de Allah ﷺ y dijo: “¿Alguno de ustedes es incapaz de ganar mil buenas obras cada día?” Le preguntaron cómo. Dijo: “Que glorifique a Allah cien veces; se le escribirán mil buenas obras o se le borrarán mil pecados.”`,
   zh:`我们在安拉的使者ﷺ身边，他说：“你们中有谁做不到每天获得一千件善功吗？”有人问怎样做。他说：“赞颂真主一百次，就会为他记下一千件善功，或为他抹去一千件罪过。”`,
   ja:`私たちがアッラーの使徒ﷺのもとにいると、彼は言った。「あなた方の中に、毎日千の善行を得ることができない者がいるだろうか。」どうやってかと問われると、彼は言った。「アッラーを百回讃えれば、千の善行が書き記されるか、千の罪が消される。」`,
   id:`Kami bersama Rasulullah ﷺ, lalu beliau bersabda: “Apakah salah seorang dari kalian tidak mampu meraih seribu kebaikan setiap hari?” Ada yang bertanya bagaimana caranya. Beliau bersabda: “Ia bertasbih seratus kali, maka ditulis baginya seribu kebaikan atau dihapus darinya seribu kesalahan.”`}},
 {id:'hmizan',d:'hamd',col:'muslim',n:223,book:'tahara',nar:'abumalik',g:'sahih',also:[],
  ar:`الطُّهُورُ شَطْرُ الإِيمَانِ، وَالْحَمْدُ لِلَّهِ تَمْلأُ الْمِيزَانَ، وَسُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ تَمْلآنِ - أَوْ تَمْلأُ - مَا بَيْنَ السَّمَوَاتِ وَالأَرْضِ …`,
  tx:{en:`The Messenger of Allah ﷺ said: “Purity is half of faith. Alhamdulillah fills the scale, and SubhanAllah and Alhamdulillah fill what is between the heavens and the earth.”`,
   bn:`রাসূলুল্লাহ ﷺ বলেছেন: “পবিত্রতা ঈমানের অর্ধেক। ‘আলহামদুলিল্লাহ’ মীযান (দাঁড়িপাল্লা) পূর্ণ করে দেয়, আর ‘সুবহানাল্লাহ ওয়াল হামদুলিল্লাহ’ আসমান ও জমিনের মধ্যবর্তী স্থান পূর্ণ করে দেয়।”`,
   ur:`رسول اللہ ﷺ نے فرمایا: ”پاکیزگی نصف ایمان ہے، الحمد للہ میزان کو بھر دیتا ہے، اور سبحان اللہ اور الحمد للہ آسمانوں اور زمین کے درمیان کی جگہ کو بھر دیتے ہیں۔“`,
   hi:`रसूलुल्लाह ﷺ ने फ़रमाया: “पवित्रता आधा ईमान है। अल्हम्दुलिल्लाह तराज़ू को भर देता है, और सुब्हानल्लाह व अल्हम्दुलिल्लाह आसमानों और ज़मीन के बीच की जगह भर देते हैं।”`,
   fil:`Sinabi ng Sugo ng Allah ﷺ: “Ang kalinisan ay kalahati ng pananampalataya. Ang Alhamdulillah ay pumupuno sa timbangan, at ang SubhanAllah at Alhamdulillah ay pumupuno sa pagitan ng kalangitan at ng lupa.”`,
   pt:`O Mensageiro de Allah ﷺ disse: “A purificação é metade da fé. Alhamdulillah enche a balança, e SubhanAllah e Alhamdulillah enchem o que há entre os céus e a terra.”`,
   es:`El Mensajero de Allah ﷺ dijo: “La purificación es la mitad de la fe. Alhamdulillah llena la balanza, y SubhanAllah y Alhamdulillah llenan lo que hay entre los cielos y la tierra.”`,
   zh:`安拉的使者ﷺ说：“洁净是信仰的一半。‘感赞真主’使天秤充满，‘赞颂真主’与‘感赞真主’充满天地之间。”`,
   ja:`アッラーの使徒ﷺは言った。「清浄は信仰の半分である。アルハムドゥリッラーは秤を満たし、スブハーナッラーとアルハムドゥリッラーは天と地の間を満たす。」`,
   id:`Rasulullah ﷺ bersabda: “Bersuci adalah separuh iman. Alhamdulillah memenuhi timbangan, dan Subhanallah serta Alhamdulillah memenuhi apa yang ada di antara langit dan bumi.”`}},
 {id:'hfatimah',d:'akbar',col:'bukhari',n:3705,book:'sahaba',nar:'ali',g:'sahih',also:[['muslim',2727]],
  ar:`… تُكَبِّرَا أَرْبَعًا وَثَلاَثِينَ، وَتُسَبِّحَا ثَلاَثًا وَثَلاَثِينَ، وَتَحْمَدَا ثَلاَثَةً وَثَلاَثِينَ …`,
  tx:{en:`Fatimah (RA) asked the Prophet ﷺ for a servant. He said to her and ‘Ali: “Shall I not teach you something better than what you asked for? When you go to bed, say Allahu Akbar 34 times, SubhanAllah 33 times and Alhamdulillah 33 times. That is better for you than a servant.”`,
   bn:`ফাতিমা (রা.) নবী ﷺ-এর কাছে একজন খাদেম চাইলেন। তিনি ফাতিমা ও আলীকে বললেন: “তোমরা যা চেয়েছ তার চেয়ে উত্তম কিছু কি শিখিয়ে দেব না? যখন বিছানায় যাবে, ৩৪ বার আল্লাহু আকবার, ৩৩ বার সুবহানাল্লাহ ও ৩৩ বার আলহামদুলিল্লাহ বলবে। এটি তোমাদের জন্য খাদেমের চেয়ে উত্তম।”`,
   ur:`فاطمہ رضی اللہ عنہا نے نبی ﷺ سے ایک خادم مانگا۔ آپ نے فاطمہ اور علی سے فرمایا: ”کیا میں تمہیں اس سے بہتر چیز نہ سکھاؤں جو تم نے مانگی؟ جب بستر پر جاؤ تو ۳۴ بار اللہ اکبر، ۳۳ بار سبحان اللہ اور ۳۳ بار الحمد للہ کہو، یہ تمہارے لیے خادم سے بہتر ہے۔“`,
   hi:`फ़ातिमा (र.) ने नबी ﷺ से एक ख़ादिम माँगा। आपने फ़ातिमा और अली से फ़रमाया: “जो तुमने माँगा उससे बेहतर चीज़ क्या मैं तुम्हें न सिखाऊँ? जब बिस्तर पर जाओ तो 34 बार अल्लाहु अकबर, 33 बार सुब्हानल्लाह और 33 बार अल्हम्दुलिल्लाह कहो। यह तुम्हारे लिए ख़ादिम से बेहतर है।”`,
   fil:`Humiling si Fatimah (RA) sa Propeta ﷺ ng isang katulong. Sinabi niya kina Fatimah at ‘Ali: “Hindi ko ba kayo tuturuan ng mas mabuti kaysa sa hiniling ninyo? Kapag kayo ay hihiga na, sabihin ang Allahu Akbar nang 34 beses, SubhanAllah nang 33 beses at Alhamdulillah nang 33 beses. Iyan ay mas mabuti para sa inyo kaysa sa katulong.”`,
   pt:`Fátima (RA) pediu um servo ao Profeta ﷺ. Ele disse a ela e a ‘Ali: “Não lhes ensinarei algo melhor do que o que pediram? Ao se deitarem, digam Allahu Akbar 34 vezes, SubhanAllah 33 vezes e Alhamdulillah 33 vezes. Isso é melhor para vocês do que um servo.”`,
   es:`Fátima (RA) le pidió un sirviente al Profeta ﷺ. Él les dijo a ella y a ‘Alí: “¿No les enseño algo mejor que lo que pidieron? Cuando se acuesten, digan Allahu Akbar 34 veces, SubhanAllah 33 veces y Alhamdulillah 33 veces. Eso es mejor para ustedes que un sirviente.”`,
   zh:`法蒂玛向先知ﷺ请求一名仆人。他对法蒂玛和阿里说：“我不教你们比你们所求的更好的东西吗？你们就寝时，念‘真主至大’34遍、‘赞颂真主’33遍、‘感赞真主’33遍。这对你们比仆人更好。”`,
   ja:`ファーティマは預言者ﷺに召使いを求めた。彼はファーティマとアリーに言った。「あなた方が求めたものより良いことを教えようか。床に就くとき、アッラーフ・アクバルを34回、スブハーナッラーを33回、アルハムドゥリッラーを33回唱えなさい。それは召使いよりもあなた方にとって良い。」`,
   id:`Fatimah (RA) meminta seorang pembantu kepada Nabi ﷺ. Beliau bersabda kepada Fatimah dan ‘Ali: “Maukah aku ajarkan sesuatu yang lebih baik dari yang kalian minta? Jika kalian hendak tidur, bacalah Allahu Akbar 34 kali, Subhanallah 33 kali, dan Alhamdulillah 33 kali. Itu lebih baik bagi kalian daripada pembantu.”`}},
 {id:'hsalah',d:'subhan',col:'muslim',n:597,book:'masajid',nar:'abuhurayra',g:'sahih',also:[],
  ar:`مَنْ سَبَّحَ اللَّهَ فِي دُبُرِ كُلِّ صَلاَةٍ ثَلاَثًا وَثَلاَثِينَ، وَحَمِدَ اللَّهَ ثَلاَثًا وَثَلاَثِينَ، وَكَبَّرَ اللَّهَ ثَلاَثًا وَثَلاَثِينَ … غُفِرَتْ خَطَايَاهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ الْبَحْرِ`,
  tx:{en:`The Messenger of Allah ﷺ said: “Whoever glorifies Allah 33 times after every prayer, praises Allah 33 times and declares His greatness 33 times — that is 99 — and completes the hundred with La ilaha illallahu wahdahu la sharika lah, lahul-mulku wa lahul-hamd, wa huwa ‘ala kulli shay’in qadir, his sins are forgiven even if they are like the foam of the sea.”`,
   bn:`রাসূলুল্লাহ ﷺ বলেছেন: “যে ব্যক্তি প্রত্যেক নামাযের পর ৩৩ বার সুবহানাল্লাহ, ৩৩ বার আলহামদুলিল্লাহ ও ৩৩ বার আল্লাহু আকবার বলে — মোট ৯৯ — এবং ‘লা ইলাহা ইল্লাল্লাহু ওয়াহদাহু লা শারিকা লাহু…’ বলে একশ পূর্ণ করে, তার গুনাহ সমুদ্রের ফেনার মতো হলেও ক্ষমা করে দেওয়া হয়।”`,
   ur:`رسول اللہ ﷺ نے فرمایا: ”جو ہر نماز کے بعد ۳۳ بار سبحان اللہ، ۳۳ بار الحمد للہ اور ۳۳ بار اللہ اکبر کہے — یہ ۹۹ ہوئے — اور سو پورا کرنے کے لیے ’لا الٰہ الا اللہ وحدہ لا شریک لہ…‘ کہے، اس کے گناہ معاف کر دیے جاتے ہیں اگرچہ سمندر کی جھاگ کے برابر ہوں۔“`,
   hi:`रसूलुल्लाह ﷺ ने फ़रमाया: “जो हर नमाज़ के बाद 33 बार सुब्हानल्लाह, 33 बार अल्हम्दुलिल्लाह और 33 बार अल्लाहु अकबर कहे — यह 99 हुए — और सौ पूरा करने के लिए ‘ला इलाहा इल्लल्लाहु वहदहू ला शरीका लहू…’ कहे, उसके गुनाह माफ़ कर दिए जाते हैं चाहे वे समुद्र के झाग के बराबर हों।”`,
   fil:`Sinabi ng Sugo ng Allah ﷺ: “Sinumang magluwalhati sa Allah nang 33 beses pagkatapos ng bawat dasal, magpuri sa Allah nang 33 beses at magsabi ng Allahu Akbar nang 33 beses — iyan ay 99 — at kumpletuhin ang isandaan sa pagsabi ng La ilaha illallahu wahdahu la sharika lah…, patatawarin ang kanyang mga kasalanan kahit ito ay tulad ng bula ng dagat.”`,
   pt:`O Mensageiro de Allah ﷺ disse: “Quem glorificar Allah 33 vezes após cada oração, louvá-Lo 33 vezes e proclamar Sua grandeza 33 vezes — isso dá 99 — e completar a centena dizendo La ilaha illallahu wahdahu la sharika lah…, terá seus pecados perdoados, mesmo que sejam como a espuma do mar.”`,
   es:`El Mensajero de Allah ﷺ dijo: “Quien glorifique a Allah 33 veces después de cada oración, lo alabe 33 veces y proclame Su grandeza 33 veces —eso suma 99— y complete el cien diciendo La ilaha illallahu wahdahu la sharika lah…, se le perdonan sus pecados aunque sean como la espuma del mar.”`,
   zh:`安拉的使者ﷺ说：“谁在每次礼拜后赞颂真主33遍、感赞真主33遍、称颂真主至大33遍——共99遍——并以‘万物非主，唯有真主，独一无偶……’凑满一百，他的罪过即使多如海沫也会被饶恕。”`,
   ja:`アッラーの使徒ﷺは言った。「毎回の礼拝の後にアッラーを33回讃え、33回称賛し、33回その偉大さを唱えて99回とし、『ラー・イラーハ・イッラッラーフ・ワフダフ・ラー・シャリーカ・ラフ…』で百を満たす者は、その罪が海の泡のように多くとも赦される。」`,
   id:`Rasulullah ﷺ bersabda: “Barang siapa bertasbih kepada Allah 33 kali setiap selesai shalat, bertahmid 33 kali, dan bertakbir 33 kali — itu 99 — lalu menggenapkan seratus dengan La ilaha illallahu wahdahu la syarika lah…, maka diampuni kesalahannya walaupun sebanyak buih di lautan.”`}},
 {id:'hriqab',d:'wahdahu',col:'bukhari',n:6403,book:'dawat',nar:'abuhurayra',g:'sahih',also:[['bukhari',3293],['muslim',2691]],
  ar:`مَنْ قَالَ: لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، فِي يَوْمٍ مِائَةَ مَرَّةٍ، كَانَتْ لَهُ عَدْلَ عَشْرِ رِقَابٍ …`,
  tx:{en:`The Messenger of Allah ﷺ said: “Whoever says La ilaha illallahu wahdahu la sharika lah, lahul-mulku wa lahul-hamd, wa huwa ‘ala kulli shay’in qadir a hundred times in a day, it is equal to freeing ten slaves; a hundred good deeds are written for him, a hundred sins are erased, and it is a protection for him from Shaytan that day until evening.”`,
   bn:`রাসূলুল্লাহ ﷺ বলেছেন: “যে ব্যক্তি দিনে একশবার ‘লা ইলাহা ইল্লাল্লাহু ওয়াহদাহু লা শারিকা লাহু, লাহুল মুলকু ওয়া লাহুল হামদু, ওয়া হুয়া আলা কুল্লি শাইয়িন কাদীর’ বলে, সে দশজন দাস মুক্ত করার সমান সওয়াব পায়, তার জন্য একশ নেকি লেখা হয়, একশ গুনাহ মুছে দেওয়া হয় এবং সেদিন সন্ধ্যা পর্যন্ত এটি তাকে শয়তান থেকে রক্ষা করে।”`,
   ur:`رسول اللہ ﷺ نے فرمایا: ”جو شخص دن میں سو بار لا الٰہ الا اللہ وحدہ لا شریک لہ، لہ الملک ولہ الحمد وہو علی کل شیء قدیر کہے، اسے دس غلام آزاد کرنے کے برابر ثواب ملتا ہے، اس کے لیے سو نیکیاں لکھی جاتی ہیں، سو گناہ مٹا دیے جاتے ہیں اور اس دن شام تک یہ شیطان سے اس کی حفاظت بنتا ہے۔“`,
   hi:`रसूलुल्लाह ﷺ ने फ़रमाया: “जो व्यक्ति दिन में सौ बार ‘ला इलाहा इल्लल्लाहु वहदहू ला शरीका लहू, लहुल मुल्कु व लहुल हम्दु, व हुवा अला कुल्लि शैइन क़दीर’ कहे, उसे दस ग़ुलाम आज़ाद करने के बराबर सवाब मिलता है, उसके लिए सौ नेकियाँ लिखी जाती हैं, सौ गुनाह मिटाए जाते हैं, और उस दिन शाम तक यह उसे शैतान से बचाता है।”`,
   fil:`Sinabi ng Sugo ng Allah ﷺ: “Sinumang magsabi ng La ilaha illallahu wahdahu la sharika lah, lahul-mulku wa lahul-hamd, wa huwa ‘ala kulli shay’in qadir nang isandaang beses sa isang araw, katumbas ito ng pagpapalaya ng sampung alipin; isusulat para sa kanya ang isandaang mabuting gawa, buburahin ang isandaang kasalanan, at magiging proteksyon niya ito laban kay Satanas sa araw na iyon hanggang gabi.”`,
   pt:`O Mensageiro de Allah ﷺ disse: “Quem disser La ilaha illallahu wahdahu la sharika lah, lahul-mulku wa lahul-hamd, wa huwa ‘ala kulli shay’in qadir cem vezes num dia, isso equivale a libertar dez escravos; cem boas ações são registradas para ele, cem pecados são apagados, e isso o protege de Satanás naquele dia até o anoitecer.”`,
   es:`El Mensajero de Allah ﷺ dijo: “Quien diga La ilaha illallahu wahdahu la sharika lah, lahul-mulku wa lahul-hamd, wa huwa ‘ala kulli shay’in qadir cien veces en un día, equivale a liberar diez esclavos; se le escriben cien buenas obras, se le borran cien pecados y lo protege de Satanás ese día hasta la noche.”`,
   zh:`安拉的使者ﷺ说：“谁一天之内念一百遍‘万物非主，唯有真主，独一无偶，国权和赞颂全归于祂，祂对万事是全能的’，就如同释放了十个奴隶，为他记下一百件善功，抹去一百件罪过，并且当天直到傍晚都能保护他免受恶魔侵扰。”`,
   ja:`アッラーの使徒ﷺは言った。「一日に百回『ラー・イラーハ・イッラッラーフ・ワフダフ・ラー・シャリーカ・ラフ、ラフル・ムルク・ワ・ラフル・ハムド、ワ・フワ・アラー・クッリ・シャイイン・カディール』と唱える者は、十人の奴隷を解放したに等しく、百の善行が記され、百の罪が消され、その日の夕方までシャイターンからの守りとなる。」`,
   id:`Rasulullah ﷺ bersabda: “Barang siapa mengucapkan La ilaha illallahu wahdahu la syarika lah, lahul mulku wa lahul hamdu wa huwa ‘ala kulli syai’in qadir seratus kali dalam sehari, maka baginya pahala seperti memerdekakan sepuluh budak, ditulis baginya seratus kebaikan, dihapus darinya seratus keburukan, dan itu menjadi pelindung baginya dari setan pada hari itu hingga sore.”`}},
 {id:'hafdal',d:'tahlil',col:'tirmidhi',n:3383,book:'tdawat',nar:'jabir',g:'hasan',gBy:'Darussalam',also:[['ibnmajah',3800]],
  ar:`أَفْضَلُ الذِّكْرِ لاَ إِلَهَ إِلاَّ اللَّهُ، وَأَفْضَلُ الدُّعَاءِ الْحَمْدُ لِلَّهِ`,
  tx:{en:`The Messenger of Allah ﷺ said: “The best remembrance is La ilaha illallah, and the best supplication is Alhamdulillah.”`,
   bn:`রাসূলুল্লাহ ﷺ বলেছেন: “সর্বোত্তম যিকির ‘লা ইলাহা ইল্লাল্লাহ’, আর সর্বোত্তম দোয়া ‘আলহামদুলিল্লাহ’।”`,
   ur:`رسول اللہ ﷺ نے فرمایا: ”سب سے افضل ذکر لا الٰہ الا اللہ ہے اور سب سے افضل دعا الحمد للہ ہے۔“`,
   hi:`रसूलुल्लाह ﷺ ने फ़रमाया: “सबसे बेहतरीन ज़िक्र ‘ला इलाहा इल्लल्लाह’ है, और सबसे बेहतरीन दुआ ‘अल्हम्दुलिल्लाह’ है।”`,
   fil:`Sinabi ng Sugo ng Allah ﷺ: “Ang pinakamahusay na pag-alaala ay La ilaha illallah, at ang pinakamahusay na panalangin ay Alhamdulillah.”`,
   pt:`O Mensageiro de Allah ﷺ disse: “A melhor recordação é La ilaha illallah, e a melhor súplica é Alhamdulillah.”`,
   es:`El Mensajero de Allah ﷺ dijo: “El mejor recuerdo es La ilaha illallah, y la mejor súplica es Alhamdulillah.”`,
   zh:`安拉的使者ﷺ说：“最优秀的记念是‘万物非主，唯有真主’，最优秀的祈祷是‘一切赞颂全归真主’。”`,
   ja:`アッラーの使徒ﷺは言った。「最も優れたズィクルはラー・イラーハ・イッラッラーであり、最も優れた祈願はアルハムドゥリッラーである。」`,
   id:`Rasulullah ﷺ bersabda: “Zikir yang paling utama adalah La ilaha illallah, dan doa yang paling utama adalah Alhamdulillah.”`}},
 {id:'histighfar',d:'istighfar',col:'bukhari',n:6307,book:'dawat',nar:'abuhurayra',g:'sahih',also:[],
  ar:`وَاللَّهِ إِنِّي لأَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ فِي الْيَوْمِ أَكْثَرَ مِنْ سَبْعِينَ مَرَّةً`,
  tx:{en:`The Messenger of Allah ﷺ said: “By Allah, I seek Allah’s forgiveness and repent to Him more than seventy times a day.”`,
   bn:`রাসূলুল্লাহ ﷺ বলেছেন: “আল্লাহর কসম! আমি দিনে সত্তর বারেরও বেশি আল্লাহর কাছে ক্ষমা প্রার্থনা করি ও তাঁর দিকে তওবা করি।”`,
   ur:`رسول اللہ ﷺ نے فرمایا: ”اللہ کی قسم! میں دن میں ستر سے زیادہ مرتبہ اللہ سے مغفرت مانگتا ہوں اور اس کی طرف توبہ کرتا ہوں۔“`,
   hi:`रसूलुल्लाह ﷺ ने फ़रमाया: “अल्लाह की क़सम! मैं दिन में सत्तर से ज़्यादा बार अल्लाह से माफ़ी माँगता हूँ और उसकी ओर तौबा करता हूँ।”`,
   fil:`Sinabi ng Sugo ng Allah ﷺ: “Sumpa man sa Allah, humihingi ako ng kapatawaran sa Allah at nagsisisi sa Kanya nang higit sa pitumpung beses bawat araw.”`,
   pt:`O Mensageiro de Allah ﷺ disse: “Por Allah, eu peço perdão a Allah e me arrependo diante Dele mais de setenta vezes por dia.”`,
   es:`El Mensajero de Allah ﷺ dijo: “Por Allah, le pido perdón a Allah y me arrepiento ante Él más de setenta veces al día.”`,
   zh:`安拉的使者ﷺ说：“指真主发誓，我每天向真主求饶恕、向祂忏悔超过七十次。”`,
   ja:`アッラーの使徒ﷺは言った。「アッラーに誓って、私は一日に七十回以上アッラーに赦しを請い、悔悟している。」`,
   id:`Rasulullah ﷺ bersabda: “Demi Allah, sungguh aku memohon ampun kepada Allah dan bertaubat kepada-Nya lebih dari tujuh puluh kali dalam sehari.”`}},
 {id:'hkanz',d:'hawqala',col:'bukhari',n:6384,book:'dawat',nar:'abumusa',g:'sahih',also:[['muslim',2704]],
  ar:`… لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ … كَنْزٌ مِنْ كُنُوزِ الْجَنَّةِ`,
  tx:{en:`The Prophet ﷺ said to Abu Musa: “O ‘Abdullah ibn Qais, say: La hawla wa la quwwata illa billah, for it is one of the treasures of Paradise.”`,
   bn:`নবী ﷺ আবু মূসাকে বললেন: “হে আব্দুল্লাহ ইবনে কায়স! বলো: ‘লা হাওলা ওয়ালা কুওয়াতা ইল্লা বিল্লাহ’, কেননা এটি জান্নাতের ভান্ডারসমূহের একটি ভান্ডার।”`,
   ur:`نبی ﷺ نے ابو موسیٰ سے فرمایا: ”اے عبداللہ بن قیس! کہو: لا حول ولا قوۃ الا باللہ، کیونکہ یہ جنت کے خزانوں میں سے ایک خزانہ ہے۔“`,
   hi:`नबी ﷺ ने अबू मूसा से फ़रमाया: “ऐ अब्दुल्लाह बिन क़ैस! कहो: ला हौला वला क़ुव्वता इल्ला बिल्लाह, क्योंकि यह जन्नत के ख़ज़ानों में से एक ख़ज़ाना है।”`,
   fil:`Sinabi ng Propeta ﷺ kay Abu Musa: “O ‘Abdullah ibn Qais, sabihin mo: La hawla wa la quwwata illa billah, sapagkat ito ay isa sa mga kayamanan ng Paraiso.”`,
   pt:`O Profeta ﷺ disse a Abu Musa: “Ó ‘Abdullah ibn Qais, diga: La hawla wa la quwwata illa billah, pois é um dos tesouros do Paraíso.”`,
   es:`El Profeta ﷺ le dijo a Abu Musa: “Oh ‘Abdullah ibn Qais, decí: La hawla wa la quwwata illa billah, porque es uno de los tesoros del Paraíso.”`,
   zh:`先知ﷺ对艾布·穆萨说：“阿卜杜拉·本·盖斯啊，你要说：‘无能为力，唯靠真主’，因为它是天园宝藏中的一宝。”`,
   ja:`預言者ﷺはアブー・ムーサーに言った。「アブドゥッラー・イブン・カイスよ、ラー・ハウラ・ワラー・クウワタ・イッラー・ビッラーと唱えなさい。それは楽園の宝の一つである。」`,
   id:`Nabi ﷺ bersabda kepada Abu Musa: “Wahai ‘Abdullah bin Qais, ucapkanlah La haula wa la quwwata illa billah, karena ia adalah salah satu perbendaharaan surga.”`}},
 {id:'hsalat',d:'durood',col:'muslim',n:408,book:'salah',nar:'abuhurayra',g:'sahih',also:[],
  ar:`مَنْ صَلَّى عَلَىَّ وَاحِدَةً صَلَّى اللَّهُ عَلَيْهِ عَشْرًا`,
  tx:{en:`The Messenger of Allah ﷺ said: “Whoever sends one blessing upon me, Allah sends ten blessings upon him.”`,
   bn:`রাসূলুল্লাহ ﷺ বলেছেন: “যে আমার উপর একবার দরুদ পাঠ করে, আল্লাহ তার উপর দশবার রহমত বর্ষণ করেন।”`,
   ur:`رسول اللہ ﷺ نے فرمایا: ”جو مجھ پر ایک بار درود بھیجے، اللہ اس پر دس رحمتیں نازل فرماتا ہے۔“`,
   hi:`रसूलुल्लाह ﷺ ने फ़रमाया: “जो मुझ पर एक बार दुरूद भेजे, अल्लाह उस पर दस रहमतें भेजता है।”`,
   fil:`Sinabi ng Sugo ng Allah ﷺ: “Sinumang magpadala ng isang pagpapala sa akin, magpapadala ang Allah ng sampung pagpapala sa kanya.”`,
   pt:`O Mensageiro de Allah ﷺ disse: “Quem enviar uma bênção sobre mim, Allah enviará dez bênçãos sobre ele.”`,
   es:`El Mensajero de Allah ﷺ dijo: “Quien envíe una bendición sobre mí, Allah enviará diez bendiciones sobre él.”`,
   zh:`安拉的使者ﷺ说：“谁为我祝福一次，真主就为他赐福十次。”`,
   ja:`アッラーの使徒ﷺは言った。「私に一度祝福を祈る者には、アッラーが十度祝福を与える。」`,
   id:`Rasulullah ﷺ bersabda: “Barang siapa bershalawat kepadaku sekali, Allah bershalawat kepadanya sepuluh kali.”`}},
 {id:'hibrahim',d:'hasbuna',col:'bukhari',n:4563,book:'tafsir',nar:'ibnabbas',g:'sahih',also:[],
  ar:`حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ، قَالَهَا إِبْرَاهِيمُ عَلَيْهِ السَّلاَمُ حِينَ أُلْقِيَ فِي النَّارِ، وَقَالَهَا مُحَمَّدٌ ﷺ حِينَ قَالُوا: إِنَّ النَّاسَ قَدْ جَمَعُوا لَكُمْ فَاخْشَوْهُمْ`,
  tx:{en:`Ibn ‘Abbas (RA) said: “Hasbunallahu wa ni‘mal-wakil was said by Ibrahim (AS) when he was thrown into the fire, and by Muhammad ﷺ when people said: ‘The people have gathered against you, so fear them.’”`,
   bn:`ইবনে আব্বাস (রা.) বলেন: “‘হাসবুনাল্লাহু ওয়া নি‘মাল ওয়াকীল’ — ইবরাহীম (আ.) এ কথা বলেছিলেন যখন তাঁকে আগুনে নিক্ষেপ করা হয়েছিল, আর মুহাম্মাদ ﷺ বলেছিলেন যখন লোকেরা বলল: ‘তোমাদের বিরুদ্ধে লোকেরা সমবেত হয়েছে, সুতরাং তাদের ভয় করো।’”`,
   ur:`ابن عباس رضی اللہ عنہما نے فرمایا: ”حسبنا اللہ ونعم الوکیل ابراہیم علیہ السلام نے اس وقت کہا جب انہیں آگ میں ڈالا گیا، اور محمد ﷺ نے اس وقت کہا جب لوگوں نے کہا: ’لوگ تمہارے خلاف جمع ہو گئے ہیں، ان سے ڈرو۔‘“`,
   hi:`इब्ने अब्बास (र.) ने कहा: “‘हस्बुनल्लाहु व निअमल वकील’ — इब्राहीम (अ.) ने यह तब कहा जब उन्हें आग में डाला गया, और मुहम्मद ﷺ ने यह तब कहा जब लोगों ने कहा: ‘लोग तुम्हारे ख़िलाफ़ इकट्ठा हो गए हैं, उनसे डरो।’”`,
   fil:`Sinabi ni Ibn ‘Abbas (RA): “Ang Hasbunallahu wa ni‘mal-wakil ay sinabi ni Ibrahim (AS) nang siya ay ihagis sa apoy, at sinabi ito ni Muhammad ﷺ nang sabihin ng mga tao: ‘Nagtipon ang mga tao laban sa inyo, kaya katakutan ninyo sila.’”`,
   pt:`Ibn ‘Abbas (RA) disse: “Hasbunallahu wa ni‘mal-wakil foi dito por Ibrahim (AS) quando foi lançado ao fogo, e por Muhammad ﷺ quando lhes disseram: ‘As pessoas se reuniram contra vocês, então temam-nas.’”`,
   es:`Ibn ‘Abbas (RA) dijo: “Hasbunallahu wa ni‘mal-wakil lo dijo Ibrahim (AS) cuando fue arrojado al fuego, y lo dijo Muhammad ﷺ cuando les dijeron: ‘La gente se ha reunido contra ustedes, así que témanles.’”`,
   zh:`伊本·阿拔斯说：“‘真主使我们满足，祂是最优秀的监护者’——易卜拉欣（愿主赐他平安）被投入火中时说了这句话；当人们说‘众人已集合起来对付你们，你们要畏惧他们’时，穆罕默德ﷺ也说了这句话。”`,
   ja:`イブン・アッバースは言った。「『ハスブナッラーフ・ワ・ニウマル・ワキール』は、イブラーヒーム（彼に平安あれ）が火に投げ込まれたときに唱え、ムハンマドﷺは『人々があなた方に対して集結した、彼らを恐れよ』と言われたときに唱えた。」`,
   id:`Ibnu ‘Abbas (RA) berkata: “Hasbunallahu wa ni‘mal wakil diucapkan oleh Ibrahim (AS) ketika ia dilemparkan ke dalam api, dan diucapkan oleh Muhammad ﷺ ketika orang-orang berkata: ‘Manusia telah berkumpul untuk menyerang kalian, maka takutlah kepada mereka.’”`}},
 {id:'hshams',d:'kalimah',col:'muslim',n:2695,book:'dhikr',nar:'abuhurayra',g:'sahih',also:[],
  ar:`لأَنْ أَقُولَ سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ وَلاَ إِلَهَ إِلاَّ اللَّهُ وَاللَّهُ أَكْبَرُ أَحَبُّ إِلَىَّ مِمَّا طَلَعَتْ عَلَيْهِ الشَّمْسُ`,
  tx:{en:`The Messenger of Allah ﷺ said: “Saying SubhanAllah, walhamdulillah, wa la ilaha illallah, wallahu akbar is dearer to me than everything the sun rises upon.”`,
   bn:`রাসূলুল্লাহ ﷺ বলেছেন: “‘সুবহানাল্লাহ, ওয়ালহামদুলিল্লাহ, ওয়া লা ইলাহা ইল্লাল্লাহ, ওয়াল্লাহু আকবার’ বলা আমার কাছে সূর্য যার উপর উদিত হয় তার সবকিছুর চেয়ে প্রিয়।”`,
   ur:`رسول اللہ ﷺ نے فرمایا: ”میرا سبحان اللہ، والحمد للہ، ولا الٰہ الا اللہ، واللہ اکبر کہنا مجھے ان تمام چیزوں سے زیادہ محبوب ہے جن پر سورج طلوع ہوتا ہے۔“`,
   hi:`रसूलुल्लाह ﷺ ने फ़रमाया: “मेरा ‘सुब्हानल्लाह, वल्हम्दुलिल्लाह, व ला इलाहा इल्लल्लाह, वल्लाहु अकबर’ कहना मुझे उन सब चीज़ों से ज़्यादा प्यारा है जिन पर सूरज उगता है।”`,
   fil:`Sinabi ng Sugo ng Allah ﷺ: “Ang pagsabi ng SubhanAllah, walhamdulillah, wa la ilaha illallah, wallahu akbar ay mas mahal sa akin kaysa sa lahat ng sinisikatan ng araw.”`,
   pt:`O Mensageiro de Allah ﷺ disse: “Dizer SubhanAllah, walhamdulillah, wa la ilaha illallah, wallahu akbar me é mais querido do que tudo sobre o que o sol nasce.”`,
   es:`El Mensajero de Allah ﷺ dijo: “Decir SubhanAllah, walhamdulillah, wa la ilaha illallah, wallahu akbar me es más querido que todo aquello sobre lo que sale el sol.”`,
   zh:`安拉的使者ﷺ说：“我念‘赞颂真主，一切赞颂全归真主，万物非主唯有真主，真主至大’，比太阳照耀下的一切更让我喜爱。”`,
   ja:`アッラーの使徒ﷺは言った。「スブハーナッラー、ワルハムドゥリッラー、ワ・ラー・イラーハ・イッラッラー、ワッラーフ・アクバルと唱えることは、太陽が昇るすべてのものよりも私にとって愛おしい。」`,
   id:`Rasulullah ﷺ bersabda: “Sungguh, aku mengucapkan Subhanallah, walhamdulillah, wa la ilaha illallah, wallahu akbar lebih aku cintai daripada segala sesuatu yang disinari matahari.”`}}
];

 {id:'h100',d:'tawba',col:'muslim',n:2702,book:'dhikr',nar:'agharr',g:'sahih',also:[],
  ar:`إِنَّهُ لَيُغَانُ عَلَى قَلْبِي وَإِنِّي لأَسْتَغْفِرُ اللَّهَ فِي الْيَوْمِ مِائَةَ مَرَّةٍ`,
  tx:{en:`The Messenger of Allah ﷺ said: “At times a cloud comes over my heart, and I seek Allah’s forgiveness a hundred times a day.”`,
   bn:`রাসূলুল্লাহ ﷺ বলেছেন: “কখনো কখনো আমার অন্তরে আবরণ পড়ে, আর আমি দিনে একশবার আল্লাহর কাছে ক্ষমা প্রার্থনা করি।”`,
   ur:`رسول اللہ ﷺ نے فرمایا: ”کبھی میرے دل پر پردہ سا آ جاتا ہے، اور میں دن میں سو بار اللہ سے مغفرت مانگتا ہوں۔“`,
   hi:`रसूलुल्लाह ﷺ ने फ़रमाया: “कभी मेरे दिल पर एक परदा-सा छा जाता है, और मैं दिन में सौ बार अल्लाह से माफ़ी माँगता हूँ।”`,
   fil:`Sinabi ng Sugo ng Allah ﷺ: “Kung minsan ay may lambong na bumabalot sa aking puso, at humihingi ako ng kapatawaran sa Allah nang isandaang beses bawat araw.”`,
   pt:`O Mensageiro de Allah ﷺ disse: “Às vezes um véu cobre meu coração, e eu peço perdão a Allah cem vezes por dia.”`,
   es:`El Mensajero de Allah ﷺ dijo: “A veces un velo cubre mi corazón, y le pido perdón a Allah cien veces al día.”`,
   zh:`安拉的使者ﷺ说：“我的心有时会被遮蔽，我每天向真主求饶恕一百次。”`,
   ja:`アッラーの使徒ﷺは言った。「時に私の心は覆われることがある。私は一日に百回アッラーに赦しを請う。」`,

 {id:'hjuw',d:'juwayriya',col:'muslim',n:2726,book:'dhikr',nar:'juwayriyah',g:'sahih',also:[],
  ar:`… سُبْحَانَ اللَّهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ وَرِضَا نَفْسِهِ وَزِنَةَ عَرْشِهِ وَمِدَادَ كَلِمَاتِهِ`,
  tx:{en:`The Prophet ﷺ left Juwayriyah after the dawn prayer while she sat in her place of prayer, and returned in the late morning to find her still there. He said: “After leaving you I said four phrases three times; if they were weighed against all you have said today, they would outweigh it: SubhanAllahi wa bihamdihi, ‘adada khalqihi, wa rida nafsihi, wa zinata ‘arshihi, wa midada kalimatihi.”`,
   bn:`নবী ﷺ ফজরের পর জুওয়াইরিয়াকে তাঁর নামাযের স্থানে বসা অবস্থায় রেখে বের হলেন এবং দুপুরের আগে ফিরে তাঁকে সেখানেই পেলেন। তিনি বললেন: “তোমার কাছ থেকে যাওয়ার পর আমি চারটি বাক্য তিনবার বলেছি; আজ তুমি যা বলেছ তার সাথে ওজন করলে এগুলো ভারী হবে: সুবহানাল্লাহি ওয়া বিহামদিহি, আদাদা খালকিহি, ওয়া রিদা নাফসিহি, ওয়া যিনাতা আরশিহি, ওয়া মিদাদা কালিমাতিহি।”`,
   ur:`نبی ﷺ فجر کے بعد جویریہ رضی اللہ عنہا کو ان کی جائے نماز پر بیٹھا چھوڑ کر گئے اور چاشت کے وقت لوٹے تو وہ وہیں تھیں۔ آپ نے فرمایا: ”تمہارے پاس سے جانے کے بعد میں نے چار کلمے تین بار کہے؛ اگر انہیں ان سب کے ساتھ تولا جائے جو تم نے آج کہا تو یہ بھاری ہوں گے: سبحان اللہ وبحمدہ عدد خلقہ ورضا نفسہ وزنۃ عرشہ ومداد کلماتہ۔“`,
   hi:`नबी ﷺ फ़ज्र के बाद जुवैरिया (र.) को उनकी नमाज़ की जगह पर बैठा छोड़कर गए और चाश्त के वक़्त लौटे तो वे वहीं थीं। आपने फ़रमाया: “तुम्हारे पास से जाने के बाद मैंने चार कलिमे तीन बार कहे; अगर इन्हें उस सबके साथ तौला जाए जो तुमने आज कहा, तो ये भारी होंगे: सुब्हानल्लाहि व बिहम्दिही, अदद ख़ल्क़िही, व रिज़ा नफ़्सिही, व ज़िनत अर्शिही, व मिदाद कलिमातिही।”`,
   fil:`Iniwan ng Propeta ﷺ si Juwayriyah pagkatapos ng dasal sa madaling-araw habang nakaupo siya sa kanyang dasalan, at bumalik siya bago tanghali na naroon pa rin siya. Sinabi niya: “Pagkaalis ko, nagsabi ako ng apat na pangungusap nang tatlong beses; kung titimbangin ang mga ito laban sa lahat ng sinabi mo ngayong araw, mas mabigat ang mga ito: SubhanAllahi wa bihamdihi, ‘adada khalqihi, wa rida nafsihi, wa zinata ‘arshihi, wa midada kalimatihi.”`,
   pt:`O Profeta ﷺ deixou Juwayriyah após a oração da alvorada, sentada em seu lugar de oração, e voltou no meio da manhã encontrando-a ainda ali. Ele disse: “Depois de sair, eu disse quatro frases três vezes; se fossem pesadas contra tudo o que você disse hoje, pesariam mais: SubhanAllahi wa bihamdihi, ‘adada khalqihi, wa rida nafsihi, wa zinata ‘arshihi, wa midada kalimatihi.”`,
   es:`El Profeta ﷺ dejó a Juwayriyah después de la oración del alba, sentada en su lugar de oración, y al volver a media mañana la encontró ahí. Dijo: “Después de irme dije cuatro frases tres veces; si se pesaran contra todo lo que dijiste hoy, pesarían más: SubhanAllahi wa bihamdihi, ‘adada khalqihi, wa rida nafsihi, wa zinata ‘arshihi, wa midada kalimatihi.”`,
   zh:`先知ﷺ在晨礼后离开时，朱韦里亚坐在她的礼拜处；上午他回来时，她仍坐在那里。他说：“我离开你后说了四句话，各说三遍；若与你今天所念的一切相比，这四句会更重：赞颂真主并赞美祂，其数如祂的造物之多，如祂所喜悦，重如祂的宝座，多如书写祂言辞的墨水。”`,
   ja:`預言者ﷺは夜明けの礼拝の後、礼拝の場に座るジュワイリヤを残して出かけ、昼前に戻ると彼女はまだそこにいた。彼は言った。「あなたのもとを出た後、私は四つの言葉を三回唱えた。あなたが今日唱えたすべてと量り比べれば、それらの方が重い。スブハーナッラーヒ・ワ・ビハムディヒ、アダダ・ハルキヒ、ワ・リダー・ナフスィヒ、ワ・ズィナタ・アルシヒ、ワ・ミダーダ・カリマーティヒ。」`,
   id:`Nabi ﷺ keluar meninggalkan Juwairiyah selepas shalat Subuh ketika ia duduk di tempat shalatnya, lalu kembali di waktu dhuha dan ia masih di sana. Beliau bersabda: “Setelah meninggalkanmu, aku mengucapkan empat kalimat tiga kali; jika ditimbang dengan semua yang kamu ucapkan hari ini, niscaya lebih berat: Subhanallahi wa bihamdihi, ‘adada khalqihi, wa ridha nafsihi, wa zinata ‘arsyihi, wa midada kalimatihi.”`,
   fr:`Le Prophète ﷺ quitta Juwayriya après la prière de l’aube, assise à son lieu de prière, et revint en milieu de matinée la trouvant toujours là. Il dit : « Après t’avoir quittée, j’ai dit quatre phrases trois fois ; pesées contre tout ce que tu as dit aujourd’hui, elles l’emporteraient : SubhanAllahi wa bihamdihi, ‘adada khalqihi, wa rida nafsihi, wa zinata ‘arshihi, wa midada kalimatihi. »`}},
 {id:'hyunus',d:'yunus',col:'tirmidhi',n:3505,book:'tdawat',nar:'saad',g:'sahih',gBy:'Darussalam',also:[],
  ar:`… لاَ إِلَهَ إِلاَّ أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ …`,
  tx:{en:`The Messenger of Allah ﷺ said: “The supplication of Dhun-Nun (Yunus) when he called upon Allah in the belly of the whale was: La ilaha illa anta subhanaka inni kuntu minaz-zalimin. No Muslim ever supplicates with it for anything but that Allah answers him.”`,
   bn:`রাসূলুল্লাহ ﷺ বলেছেন: “মাছের পেটে থাকা অবস্থায় যুন-নূন (ইউনুস আ.)-এর দোয়া ছিল: লা ইলাহা ইল্লা আনতা সুবহানাকা ইন্নি কুনতু মিনায যালিমীন। কোনো মুসলিম যে বিষয়েই এ দোয়া করে, আল্লাহ তা কবুল করেন।”`,
   ur:`رسول اللہ ﷺ نے فرمایا: ”ذو النون (یونس علیہ السلام) کی دعا جب وہ مچھلی کے پیٹ میں تھے یہ تھی: لا الٰہ الا انت سبحانک انی کنت من الظالمین۔ کوئی مسلمان کسی بھی معاملے میں اس کے ذریعے دعا کرے تو اللہ اسے قبول فرماتا ہے۔“`,
   hi:`रसूलुल्लाह ﷺ ने फ़रमाया: “ज़ुन-नून (यूनुस अ.) ने मछली के पेट में यह दुआ की थी: ला इलाहा इल्ला अन्ता सुब्हानका इन्नी कुन्तु मिनज़्ज़ालिमीन। कोई मुसलमान किसी भी बात के लिए यह दुआ करे तो अल्लाह उसे क़बूल करता है।”`,
   fil:`Sinabi ng Sugo ng Allah ﷺ: “Ang panalangin ni Dhun-Nun (Yunus) nang siya ay nasa tiyan ng balyena ay: La ilaha illa anta subhanaka inni kuntu minaz-zalimin. Walang Muslim na nananalangin nito para sa anumang bagay malibang sasagutin siya ng Allah.”`,
   pt:`O Mensageiro de Allah ﷺ disse: “A súplica de Dhun-Nun (Yunus), quando invocou Allah no ventre da baleia, foi: La ilaha illa anta subhanaka inni kuntu minaz-zalimin. Nenhum muçulmano suplica com ela por algo sem que Allah lhe responda.”`,
   es:`El Mensajero de Allah ﷺ dijo: “La súplica de Dhun-Nun (Yunus) cuando invocó a Allah en el vientre de la ballena fue: La ilaha illa anta subhanaka inni kuntu minaz-zalimin. Ningún musulmán suplica con ella por algo sin que Allah le responda.”`,
   zh:`安拉的使者ﷺ说：“左农（优努斯）在鱼腹中祈求时说：‘除祢之外绝无应受崇拜者，赞颂祢超绝万物，我确是不义者。’任何穆斯林用它祈求任何事，真主都会应答他。”`,
   ja:`アッラーの使徒ﷺは言った。「魚の腹の中でズン・ヌーン（ユーヌス）が祈った言葉は、ラー・イラーハ・イッラー・アンタ・スブハーナカ・インニー・クントゥ・ミナッ・ザーリミーンである。ムスリムがこれで何かを祈るなら、アッラーは必ず応えられる。」`,
   id:`Rasulullah ﷺ bersabda: “Doa Dzun Nun (Yunus) ketika berdoa di dalam perut ikan adalah: La ilaha illa anta subhanaka inni kuntu minazh-zhalimin. Tidaklah seorang muslim berdoa dengannya untuk suatu hal kecuali Allah mengabulkannya.”`,
   fr:`Le Messager d’Allah ﷺ a dit : « L’invocation de Dhun-Nun (Yunus) lorsqu’il invoqua Allah dans le ventre de la baleine fut : La ilaha illa anta subhanaka inni kuntu minaz-zalimin. Aucun musulman n’invoque par elle pour une chose sans qu’Allah lui réponde. »`}},
 {id:'hmajlis',d:'rabbighfir',col:'abudawud',n:1516,book:'witr',nar:'ibnumar',g:'sahih',gBy:'Al-Albani',also:[],
  ar:`… رَبِّ اغْفِرْ لِي وَتُبْ عَلَىَّ إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ`,
  tx:{en:`Ibn ‘Umar (RA) said: “We would count the Messenger of Allah ﷺ saying a hundred times in one sitting: Rabbighfir li wa tub ‘alayya innaka antat-Tawwabur-Rahim.”`,
   bn:`ইবনে উমর (রা.) বলেন: “আমরা গুনে দেখতাম, রাসূলুল্লাহ ﷺ এক বৈঠকেই একশবার বলতেন: রব্বিগফিরলী ওয়া তুব আলাইয়া ইন্নাকা আনতাত তাওয়াবুর রাহীম।”`,
   ur:`ابن عمر رضی اللہ عنہما نے فرمایا: ”ہم گنتے تھے کہ رسول اللہ ﷺ ایک ہی مجلس میں سو بار کہتے: رب اغفر لی وتب علی انک انت التواب الرحیم۔“`,
   hi:`इब्ने उमर (र.) ने कहा: “हम गिनते थे कि रसूलुल्लाह ﷺ एक ही मजलिस में सौ बार कहते: रब्बिग़फ़िर ली व तुब अलय्या इन्नका अन्तत्तव्वाबुर्रहीम।”`,
   fil:`Sinabi ni Ibn ‘Umar (RA): “Binibilang namin na ang Sugo ng Allah ﷺ ay nagsasabi nang isandaang beses sa iisang pagtitipon: Rabbighfir li wa tub ‘alayya innaka antat-Tawwabur-Rahim.”`,
   pt:`Ibn ‘Umar (RA) disse: “Contávamos o Mensageiro de Allah ﷺ dizendo cem vezes numa mesma reunião: Rabbighfir li wa tub ‘alayya innaka antat-Tawwabur-Rahim.”`,
   es:`Ibn ‘Umar (RA) dijo: “Contábamos que el Mensajero de Allah ﷺ decía cien veces en una misma reunión: Rabbighfir li wa tub ‘alayya innaka antat-Tawwabur-Rahim.”`,
   zh:`伊本·欧麦尔说：“我们曾数过，安拉的使者ﷺ在一次聚会中念一百遍：‘我的主啊，求祢饶恕我，接受我的忏悔，祢确是至宥的、至慈的。’”`,
   ja:`イブン・ウマルは言った。「私たちは、アッラーの使徒ﷺが一つの集まりの中で百回『ラッビグフィルリー・ワ・トゥブ・アライヤ・インナカ・アンタッ・タウワーブッ・ラヒーム』と唱えるのを数えたものだった。」`,
   id:`Ibnu ‘Umar (RA) berkata: “Kami pernah menghitung Rasulullah ﷺ mengucapkan dalam satu majelis seratus kali: Rabbighfir li wa tub ‘alayya innaka antat-Tawwabur-Rahim.”`,
   fr:`Ibn ‘Umar (RA) a dit : « Nous comptions que le Messager d’Allah ﷺ disait cent fois en une seule assemblée : Rabbighfir li wa tub ‘alayya innaka antat-Tawwabur-Rahim. »`}},
 {id:'hraditu',d:'raditu',col:'abudawud',n:1529,book:'witr',nar:'abusaid',g:'sahih',gBy:'Al-Albani',also:[],
  ar:`مَنْ قَالَ رَضِيتُ بِاللَّهِ رَبًّا وَبِالإِسْلاَمِ دِينًا وَبِمُحَمَّدٍ رَسُولاً وَجَبَتْ لَهُ الْجَنَّةُ`,
  tx:{en:`The Messenger of Allah ﷺ said: “Whoever says: Raditu billahi rabban, wa bil-Islami dinan, wa bi-Muhammadin rasula — Paradise becomes due to him.”`,
   bn:`রাসূলুল্লাহ ﷺ বলেছেন: “যে ব্যক্তি বলে: ‘রাদীতু বিল্লাহি রব্বান, ওয়া বিল ইসলামি দীনান, ওয়া বি মুহাম্মাদিন রাসূলা’, তার জন্য জান্নাত অবধারিত হয়ে যায়।”`,
   ur:`رسول اللہ ﷺ نے فرمایا: ”جو کہے: رضیت باللہ ربا وبالاسلام دینا وبمحمد رسولا، اس کے لیے جنت واجب ہو جاتی ہے۔“`,
   hi:`रसूलुल्लाह ﷺ ने फ़रमाया: “जो कहे: रज़ीतु बिल्लाहि रब्बन, व बिल-इस्लामि दीनन, व बि-मुहम्मदिन रसूला — उसके लिए जन्नत वाजिब हो जाती है।”`,
   fil:`Sinabi ng Sugo ng Allah ﷺ: “Sinumang magsabi ng: Raditu billahi rabban, wa bil-Islami dinan, wa bi-Muhammadin rasula — ang Paraiso ay nakalaan para sa kanya.”`,
   pt:`O Mensageiro de Allah ﷺ disse: “Quem disser: Raditu billahi rabban, wa bil-Islami dinan, wa bi-Muhammadin rasula — o Paraíso lhe é garantido.”`,
   es:`El Mensajero de Allah ﷺ dijo: “Quien diga: Raditu billahi rabban, wa bil-Islami dinan, wa bi-Muhammadin rasula, tiene asegurado el Paraíso.”`,
   zh:`安拉的使者ﷺ说：“谁说：‘我喜悦真主为主，伊斯兰为宗教，穆罕默德为使者’，天园对他是必然的。”`,
   ja:`アッラーの使徒ﷺは言った。「『ラディートゥ・ビッラーヒ・ラッバン、ワ・ビル・イスラーミ・ディーナン、ワ・ビ・ムハンマディン・ラスーラ』と唱える者には、楽園が確約される。」`,
   id:`Rasulullah ﷺ bersabda: “Barang siapa mengucapkan: Radhitu billahi rabban, wa bil-Islami dinan, wa bi-Muhammadin rasula, maka wajib baginya surga.”`,
   fr:`Le Messager d’Allah ﷺ a dit : « Quiconque dit : Raditu billahi rabban, wa bil-Islami dinan, wa bi-Muhammadin rasula, le Paradis lui est acquis. »`}}
);
const FR_H={
 hkalimatan:`Le Prophète ﷺ a dit : « Deux paroles sont aimées du Tout Miséricordieux, légères sur la langue et lourdes dans la balance : SubhanAllahi wa bihamdihi, SubhanAllahil-‘Azim. »`,
 hzabad:`Le Messager d’Allah ﷺ a dit : « Quiconque dit SubhanAllahi wa bihamdihi cent fois par jour, ses péchés sont effacés, même s’ils sont comme l’écume de la mer. »`,
 h1000:`Nous étions auprès du Messager d’Allah ﷺ et il dit : « L’un de vous est-il incapable de gagner mille bonnes actions chaque jour ? » On lui demanda comment. Il dit : « Qu’il glorifie Allah cent fois : mille bonnes actions lui seront inscrites, ou mille péchés lui seront effacés. »`,
 hmizan:`Le Messager d’Allah ﷺ a dit : « La purification est la moitié de la foi. Alhamdulillah remplit la balance, et SubhanAllah et Alhamdulillah remplissent ce qui est entre les cieux et la terre. »`,
 hfatimah:`Fatima (RA) demanda un serviteur au Prophète ﷺ. Il lui dit, ainsi qu’à ‘Ali : « Ne vous enseignerai-je pas mieux que ce que vous avez demandé ? Quand vous vous couchez, dites Allahu Akbar 34 fois, SubhanAllah 33 fois et Alhamdulillah 33 fois. Cela vaut mieux pour vous qu’un serviteur. »`,
 hsalah:`Le Messager d’Allah ﷺ a dit : « Quiconque glorifie Allah 33 fois après chaque prière, Le loue 33 fois et proclame Sa grandeur 33 fois — cela fait 99 — et complète la centaine par La ilaha illallahu wahdahu la sharika lah…, ses péchés sont pardonnés, même s’ils sont comme l’écume de la mer. »`,
 hriqab:`Le Messager d’Allah ﷺ a dit : « Quiconque dit La ilaha illallahu wahdahu la sharika lah, lahul-mulku wa lahul-hamd, wa huwa ‘ala kulli shay’in qadir cent fois en un jour, cela équivaut à affranchir dix esclaves ; cent bonnes actions lui sont inscrites, cent péchés effacés, et c’est pour lui une protection contre Satan ce jour-là jusqu’au soir. »`,
 hafdal:`Le Messager d’Allah ﷺ a dit : « Le meilleur rappel est La ilaha illallah, et la meilleure invocation est Alhamdulillah. »`,
 histighfar:`Le Messager d’Allah ﷺ a dit : « Par Allah, je demande pardon à Allah et je me repens auprès de Lui plus de soixante-dix fois par jour. »`,
 hkanz:`Le Prophète ﷺ dit à Abu Musa : « Ô ‘Abdullah ibn Qays, dis : La hawla wa la quwwata illa billah, car c’est l’un des trésors du Paradis. »`,
 hsalat:`Le Messager d’Allah ﷺ a dit : « Quiconque prie sur moi une fois, Allah prie sur lui dix fois. »`,
 hibrahim:`Ibn ‘Abbas (RA) a dit : « Hasbunallahu wa ni‘mal-wakil fut dit par Ibrahim (AS) lorsqu’il fut jeté dans le feu, et par Muhammad ﷺ lorsqu’on leur dit : ‹ Les gens se sont rassemblés contre vous, craignez-les. › »`,
 hshams:`Le Messager d’Allah ﷺ a dit : « Dire SubhanAllah, walhamdulillah, wa la ilaha illallah, wallahu akbar m’est plus cher que tout ce sur quoi le soleil se lève. »`
};

// After Diamond: 15/20/30 min; the 10 rare gems (levels 12–21) take ~20 h together (about 2 months at 20 min a day); Nur levels take 4–8.5 h each.
const RARE=[40,60,75,90,105,120,140,160,190,220];
const dur=n=>(n<8?n+1:n<11?[15,20,30][n-8]:n<21?RARE[n-11]:n<51?240+30*Math.floor((n-21)/3):540)*60000;
const gemOfLevel=n=>n<=21?n-1:Math.min(30,21+Math.floor((n-22)/3));
const levelOfGem=i=>i<=20?i+1:22+(i-21)*3;

const unlockedGems=()=>gemOfLevel(Math.max(S.lv.max||1,S.lv.n))+1;

  if(reduce)return;

function fxLoop(now){
  const f=Math.min(3,Math.max(.5,(now-fxLast)/16.7));fxLast=now;
  fctx.setTransform(1,0,0,1,0,0);fctx.clearRect(0,0,fx.width,fx.height);
  let alive=0;
  for(const p of parts){if(p.life>=p.max)continue;alive++;
    p.life+=f;const dr=Math.pow(.985,f);p.vx*=dr;p.vy=p.vy*dr+.28*f;p.x+=p.vx*f;p.y+=p.vy*f;p.r+=p.vr*f;

  else{parts=[];fxRun=false;fctx.setTransform(1,0,0,1,0,0);fctx.clearRect(0,0,fx.width,fx.height)}
}

/* ================= LEADERBOARD (shared db) ================= */
let DB=null,USER=null,UID=null,board=[],boardTab='today',boardReady=false,pushT=null,pushing=false,pushAgain=false;
const utcToday=()=>S.utc.d===utcDay()?S.utc.n:0;
function pushBoardSoon(){if(!S.joined||!DB||!UID)return;clearTimeout(pushT);pushT=setTimeout(pushBoard,4000)}
async function pushBoard(){
  if(!S.joined||!DB||!UID)return;
  if(pushing){pushAgain=true;return}
  pushing=true;
  try{await DB.doc('board/'+UID).set({d:utcDay(),today:utcToday(),total:totalAll(),st:streak(),lv:S.lv.n,at:Date.now()})}catch(e){}
  pushing=false; if(pushAgain){pushAgain=false;pushBoard()}
}
(async()=>{
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      USER=await window.claude.use('user').catch(()=>null);
      UID=USER?await USER.id():null;
      DB=await window.claude.use('db').catch(()=>null);
      if(DB){
        DB.collection('board').onSnapshot(s=>{board=s.docs.filter(d=>d.exists).map(d=>Object.assign({id:d.id},d.data()));if(curTab==='board')renderBoard()},()=>{});
        if(S.joined)pushBoardSoon();
      }
    }
  }catch(e){}
  boardReady=true; if(curTab==='board')renderBoard();
})();
function renderBoard(){
  const v=$('v-board');
  let html=`<h1 class="vt">${esc(t('boardTitle'))}</h1>${window.TASBIH_STANDALONE?'':`<div class="seg" id="sbTop"><button data-g="streak">${esc(t('tabStreak'))}</button><button data-g="board" class="on">${esc(t('boardTitle'))}</button></div>`}<p class="bnote">${esc(t('boardNote'))}</p>
    <div class="seg" id="bTab"><button data-v="today"${boardTab==='today'?' class="on"':''}>${esc(t('boardToday'))}</button><button data-v="all"${boardTab==='all'?' class="on"':''}>${esc(t('boardAll'))}</button></div>`;
  if(!DB||!UID){
    html+=`<div class="joincard glass">${gemHex(lvGemIdx(),64)}<h3>${esc(t('boardTitle'))}</h3><p>${esc(boardReady?t('boardOff'):'…')}</p></div>`;
    v.innerHTML=html; bindBoardTabs(); return;
  }
  if(!S.joined){
    html+=`<div class="joincard glass">${gemHex(lvGemIdx(),64)}<h3>${esc(t('join'))}</h3><p>${esc(t('joinSub'))}</p>${S.sample?`<p style="color:var(--gold)">${esc(t('joinSample'))}</p>`:''}<button class="btn" id="bJoin">${ICO.nur}${esc(t('join'))}</button></div>`;
  }
  const today=utcDay();
  const rows=board.filter(r=>boardTab==='today'?(r.d===today&&r.today>0):(r.total>0))
    .map(r=>({id:r.id,v:boardTab==='today'?r.today:r.total,lv:r.lv||1,st:r.st||0}))
    .sort((a,b)=>b.v-a.v).slice(0,100);
  if(!rows.length){html+=`<div class="empty glass group">${ICO.hist}${esc(t('boardEmpty'))}</div>`}
  else{
    const row=(r,i,top)=>{const me=r.id===UID,gi=gemOfLevel(r.lv||1);
      return `<div class="${top?'prow r'+(i+1):'lrow'}${me?' me':''}" data-uid="${esc(r.id)}">
        <div class="av"><img alt="" data-av="${esc(r.id)}"><span class="rk${i<3?' k'+(i+1):''}">${fmt(i+1)}</span></div>
        <div class="nm"><b data-nm="${esc(r.id)}">${me?esc(t('you')):'…'}</b><small>${esc(t('level',{n:fmt(r.lv)}))} · ${esc(gemName(gi))} · ${esc(t('days',{n:fmt(r.st)}))}</small></div>
        <span class="score">${ICO.nur}${fcomp(r.v)}</span></div>`};
    html+=`<div class="podium">${rows.slice(0,3).map((r,i)=>row(r,i,true)).join('')}</div>`;
    if(rows.length>3)html+=`<div class="group glass">${rows.slice(3).map((r,i)=>row(r,i+3,false)).join('')}</div>`;
  }
  if(S.joined)html+=`<button class="btn block danger" id="bLeave">${esc(t('leave'))}</button>`;
  v.innerHTML=html; bindBoardTabs();
  const bj=$('bJoin');if(bj)bj.onclick=joinBoard;
  const bl=$('bLeave');if(bl)bl.onclick=leaveBoard;
  const ids=rows.map(r=>r.id);
  if(ids.length&&USER)USER.profiles(ids).then(ps=>{
    ids.forEach(id=>{const p=ps[id];if(!p)return;
      v.querySelectorAll(`[data-av="${CSS.escape(id)}"]`).forEach(img=>{img.src=p.avatarUrl});
      v.querySelectorAll(`[data-nm="${CSS.escape(id)}"]`).forEach(el=>{el.textContent=id===UID?(p.name?p.name+' · '+t('you'):t('you')):(p.name||t('someone'))});
    });
  }).catch(()=>{});
}
function bindSbTop(){document.querySelectorAll('#sbTop button').forEach(x=>x.onclick=()=>{if(x.dataset.g!==curTab)go(x.dataset.g)})}
function bindBoardTabs(){bindSbTop();const b=$('bTab');if(b)b.querySelectorAll('button').forEach(x=>x.onclick=()=>{boardTab=x.dataset.v;renderBoard()})}
function joinBoard(){
  if(S.sample){const keep={lang:S.lang,theme:S.theme,set:S.set};S=fresh(keep.lang);S.theme=keep.theme;S.set=keep.set;goal=0;vis=0;renderAll()}
  S.joined=true;save();pushBoard();renderBoard();
}
function leaveBoard(){S.joined=false;save();if(DB&&UID)DB.doc('board/'+UID).delete().catch(()=>{});renderBoard()}

let celebrating=false;
function celebrate(){
  const q=queue.shift();if(!q){celebrating=false;return}
  celebrating=true;tick(true);
  const el=$('celebrate');
  let art,name,title,desc,view;
  if(q.type==='prayed'){
    const m=SAL_MSGS[q.i%SAL_MSGS.length],body=S.lang==='ar'?m.ar:pick(m.tx);
    el.innerHTML=`<div class="celebrate" role="dialog" aria-modal="true"><div class="rays"></div>
      <div class="nudge-orb gift">${MOSQUE}</div>
      <h2>${esc(t('prayedTitle',{p:pn(q.p)}))}</h2><p>${esc(t('prayedSub'))}</p>
      <div class="rwh glass"><div class="hmeta"><span class="tag">${esc(colName(m.col))} · ${fref(m.n)}</span><span class="tag ok">${ICO.shield}${esc(t(m.g))}${m.gBy?' ('+esc(m.gBy)+')':''}</span></div>
        ${S.lang==='ar'?'':`<p class="rwar">${esc(m.ar)}</p>`}
        <p class="prose"${S.lang==='ar'?' style="font-family:var(--arabic);font-size:17px;direction:rtl"':''}>${esc(body)}</p>
        <small>${esc(t('narrator'))}: ${esc(pick(NARR[m.nar]))} · <a href="${refURL(m.col,m.n)}" target="_blank" rel="noopener" style="color:var(--accent)">sunnah.com</a></small></div>
      <div class="cta"><button class="btn" id="cAfter">${esc(t('afterTasbih'))}</button><button class="plain" id="cGo">${esc(t('keepGoing'))}</button></div></div>`;
    setTimeout(()=>confetti(innerWidth/2,innerHeight*.14,110),100);
    const done=()=>{el.innerHTML='';celebrating=false;if(queue.length)setTimeout(celebrate,250)};
    $('cGo').onclick=done;$('cAfter').onclick=()=>{done();select('subhan');go('count')};$('cAfter').focus();
    return;
  }
  if(q.type==='reward'){
    const d=q.d,ids=(d.h&&d.h.length)?d.h:['hkalimatan'],h=HMAP[ids[(q.round-1)%ids.length]],gi=beadGemIdx();
    const body=S.lang==='ar'?h.ar:pick(h.tx);
    el.innerHTML=`<div class="celebrate" role="dialog" aria-modal="true"><div class="rays"></div>
      ${gemHex(gi,96,'animation:pop .7s cubic-bezier(.2,1.6,.4,1) both;--gl:24px')}
      ${rwPill(d)}
      <h2>${esc(t('rwTitle'))}</h2><p>${esc(t('rwRound',{n:fmt(q.round),c:fmt(q.c)}))} · ${esc(dshort(d))}</p>
      <div class="rwh glass"><div class="hmeta"><span class="tag">${esc(colName(h.col))} · ${fref(h.n)}</span><span class="tag ok">${ICO.shield}${esc(t(h.g))}</span></div>
        <b>${esc(t('virtue'))} · ${esc(dname(byId(h.d)))}</b>
        <p class="prose"${S.lang==='ar'?' style="font-family:var(--arabic);font-size:17px;direction:rtl"':''}>${esc(body)}</p>
        <small>${esc(t('narrator'))}: ${esc(pick(NARR[h.nar]))}</small></div>
      <div class="cta"><button class="btn" id="cGo">${esc(t('keepGoing'))}</button><button class="plain" id="cRead">${esc(t('readFull'))}</button></div></div>`;
    setTimeout(()=>confetti(innerWidth/2,innerHeight*.14,70),100);
    const done=()=>{el.innerHTML='';celebrating=false;if(queue.length)setTimeout(celebrate,250)};
    $('cGo').onclick=done;$('cRead').onclick=()=>{done();sheetHadith(h)};$('cGo').focus();
    return;
  }
  if(q.type==='level'){const i=gemOfLevel(q.n);art=gemHex(i,132,'animation:pop .7s cubic-bezier(.2,1.6,.4,1) both;--gl:28px');name=t('level',{n:fmt(q.n)})+' · '+gemName(i);title=t('levelUp');desc=t('levelUpSub',{g:gemName(i)});view=null}
  else{const b=q.b;art=bart(b,true,120);name=b.k==='title'?b.ar+' · '+bLabel(b):bLabel(b);title=b.k==='title'?t('newTitle'):t('newBadge');desc=bDesc(b);view=t('viewBadge')}
  el.innerHTML=`<div class="celebrate" role="dialog" aria-modal="true"><div class="rays"></div>
    ${art}<div class="bname">${esc(name)}</div><h2>${esc(title)}</h2><p>${esc(desc)}</p>
    <div class="cta">${view?`<button class="btn" id="cView">${esc(view)}</button>`:''}<button class="${view?'plain':'btn'}" id="cGo">${esc(t('keepGoing'))}</button></div></div>`;
  setTimeout(()=>confetti(innerWidth/2,innerHeight*.35,140),120);
  const done=()=>{el.innerHTML='';celebrating=false;if(queue.length)setTimeout(celebrate,250)};
  if(view)$('cView').onclick=()=>{done();go('streak')};
  $('cGo').onclick=done; $('cGo').focus();
}

const SAL_MSGS=[
 {id:'s527',col:'bukhari',n:527,book:'mawaqit',nar:'ibnmasud',g:'sahih',ar:`سَأَلْتُ النَّبِيَّ ﷺ: أَيُّ الْعَمَلِ أَحَبُّ إِلَى اللَّهِ؟ قَالَ: «الصَّلاَةُ عَلَى وَقْتِهَا» …`,
  tx:{en:`Ibn Mas‘ud (RA) asked the Prophet ﷺ which deed is most beloved to Allah. He said: “Prayer at its proper time,” then kindness to parents, then striving in Allah’s cause.`,
   bn:`ইবনে মাসউদ (রা.) নবী ﷺ-কে জিজ্ঞেস করলেন, আল্লাহর কাছে সবচেয়ে প্রিয় আমল কোনটি? তিনি বললেন: “সময়মতো নামায আদায় করা,” তারপর পিতা-মাতার প্রতি সদ্ব্যবহার, তারপর আল্লাহর পথে জিহাদ।`,
   ur:`ابن مسعود رضی اللہ عنہ نے نبی ﷺ سے پوچھا کہ اللہ کو کون سا عمل سب سے زیادہ محبوب ہے؟ آپ نے فرمایا: ”وقت پر نماز“، پھر والدین سے حسنِ سلوک، پھر اللہ کی راہ میں جہاد۔`,
   hi:`इब्ने मसऊद (र.) ने नबी ﷺ से पूछा कि अल्लाह को कौन-सा अमल सबसे प्यारा है? आपने फ़रमाया: “वक़्त पर नमाज़,” फिर माँ-बाप से अच्छा सुलूक, फिर अल्लाह की राह में जिहाद।`,
   fil:`Tinanong ni Ibn Mas‘ud (RA) ang Propeta ﷺ kung aling gawa ang pinakamamahal ng Allah. Sabi niya: “Ang salah sa tamang oras nito,” saka ang kabutihan sa mga magulang, saka ang pagsisikap sa landas ng Allah.`,
   pt:`Ibn Mas‘ud (RA) perguntou ao Profeta ﷺ qual ação é a mais amada por Allah. Ele disse: “A oração no seu tempo”, depois a bondade com os pais, depois o esforço no caminho de Allah.`,
   es:`Ibn Mas‘ud (RA) le preguntó al Profeta ﷺ qué obra es la más amada por Allah. Dijo: “La oración en su tiempo”, después la bondad con los padres y después el esfuerzo en el camino de Allah.`,
   zh:`伊本·麦斯欧德问先知ﷺ：哪件善功最为真主所喜爱？他说：“按时礼拜”，其次是孝敬父母，再次是为主道奋斗。`,
   ja:`イブン・マスウードは預言者ﷺに、アッラーに最も愛される行いは何かと尋ねた。彼は言った。「時間通りの礼拝」。次に両親への孝行、次にアッラーの道における奮闘である。`,
   id:`Ibnu Mas‘ud (RA) bertanya kepada Nabi ﷺ amalan apa yang paling dicintai Allah. Beliau bersabda: “Salat pada waktunya,” kemudian berbakti kepada orang tua, kemudian berjihad di jalan Allah.`,
   fr:`Ibn Mas‘ud (RA) demanda au Prophète ﷺ quelle œuvre est la plus aimée d’Allah. Il répondit : « La prière à son heure », puis la bonté envers les parents, puis l’effort dans le sentier d’Allah.`}},
 {id:'s528',col:'bukhari',n:528,book:'mawaqit',nar:'abuhurayra',g:'sahih',ar:`… فَذَلِكَ مِثْلُ الصَّلَوَاتِ الْخَمْسِ، يَمْحُو اللَّهُ بِهَا الْخَطَايَا`,
  tx:{en:`The Prophet ﷺ said: “If there were a river at the door of one of you and he bathed in it five times a day, would any dirt remain on him? That is like the five prayers: Allah wipes away sins by them.”`,
   bn:`নবী ﷺ বলেছেন: “তোমাদের কারো দরজার পাশে যদি একটি নদী থাকে এবং সে তাতে প্রতিদিন পাঁচবার গোসল করে, তার শরীরে কি কোনো ময়লা থাকবে? পাঁচ ওয়াক্ত নামাযও তেমনি; এর মাধ্যমে আল্লাহ গুনাহ মুছে দেন।”`,
   ur:`نبی ﷺ نے فرمایا: ”اگر تم میں سے کسی کے دروازے پر نہر ہو اور وہ اس میں روزانہ پانچ بار غسل کرے تو کیا اس پر کوئی میل باقی رہے گا؟ یہی مثال پانچ نمازوں کی ہے، اللہ ان کے ذریعے گناہ مٹا دیتا ہے۔“`,
   hi:`नबी ﷺ ने फ़रमाया: “अगर तुममें से किसी के दरवाज़े पर नदी हो और वह उसमें रोज़ पाँच बार नहाए, तो क्या उस पर कोई मैल बचेगा? यही मिसाल पाँच नमाज़ों की है; अल्लाह इनसे गुनाह मिटा देता है।”`,
   fil:`Sinabi ng Propeta ﷺ: “Kung may ilog sa pintuan ng isa sa inyo at naliligo siya roon limang beses araw-araw, may matitira pa bang dumi sa kanya? Ganyan ang limang salah: binubura ng Allah ang mga kasalanan sa pamamagitan nito.”`,
   pt:`O Profeta ﷺ disse: “Se houvesse um rio à porta de um de vocês e ele se banhasse nele cinco vezes por dia, restaria nele alguma sujeira? Assim são as cinco orações: por elas Allah apaga os pecados.”`,
   es:`El Profeta ﷺ dijo: “Si hubiera un río en la puerta de uno de ustedes y se bañara en él cinco veces al día, ¿le quedaría alguna suciedad? Así son las cinco oraciones: con ellas Allah borra los pecados.”`,
   zh:`先知ﷺ说：“假如你们中有人门前有一条河，他每天在河里洗五次，他身上还会留有污垢吗？五番拜功就是这样，真主借此抹去罪过。”`,
   ja:`預言者ﷺは言った。「あなた方の誰かの家の前に川があり、毎日五回そこで沐浴するなら、汚れが残るだろうか。五回の礼拝もそのようなもので、アッラーはそれによって罪を消し去られる。」`,
   id:`Nabi ﷺ bersabda: “Seandainya ada sungai di depan pintu salah seorang dari kalian, lalu ia mandi di sana lima kali sehari, apakah masih tersisa kotoran padanya? Begitulah salat lima waktu, dengannya Allah menghapus kesalahan-kesalahan.”`,
   fr:`Le Prophète ﷺ a dit : « Si une rivière coulait à la porte de l’un de vous et qu’il s’y lavait cinq fois par jour, lui resterait-il de la saleté ? Ainsi sont les cinq prières : Allah efface par elles les péchés. »`}},
 {id:'s1522',col:'abudawud',n:1522,book:'witr',nar:'muadh',g:'sahih',gBy:'Al-Albani',ar:`اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ`,
  tx:{en:`The Prophet ﷺ advised Mu‘adh (RA) never to leave saying after every prayer: “Allahumma a‘inni ‘ala dhikrika wa shukrika wa husni ‘ibadatik” — O Allah, help me to remember You, to thank You and to worship You well.`,
   bn:`নবী ﷺ মুআয (রা.)-কে উপদেশ দিলেন, প্রত্যেক নামাযের পর এ দোয়া কখনো ছেড়ো না: “আল্লাহুম্মা আইন্নী আলা যিকরিকা ওয়া শুকরিকা ওয়া হুসনি ইবাদাতিক” — হে আল্লাহ, আপনার যিকির, শোকর ও উত্তম ইবাদতে আমাকে সাহায্য করুন।`,
   ur:`نبی ﷺ نے معاذ رضی اللہ عنہ کو وصیت کی کہ ہر نماز کے بعد یہ دعا نہ چھوڑنا: ”اللہم اعنی علی ذکرک وشکرک وحسن عبادتک“ — اے اللہ! اپنے ذکر، شکر اور اچھی عبادت پر میری مدد فرما۔`,
   hi:`नबी ﷺ ने मुआज़ (र.) को नसीहत की कि हर नमाज़ के बाद यह दुआ न छोड़ना: “अल्लाहुम्मा अइन्नी अला ज़िक्रिका व शुक्रिका व हुस्नि इबादतिक” — ऐ अल्लाह, अपने ज़िक्र, शुक्र और अच्छी इबादत में मेरी मदद कर।`,
   fil:`Pinayuhan ng Propeta ﷺ si Mu‘adh (RA) na huwag kaligtaang sabihin pagkatapos ng bawat salah: “Allahumma a‘inni ‘ala dhikrika wa shukrika wa husni ‘ibadatik” — O Allah, tulungan Mo akong alalahanin Ka, pasalamatan Ka at sambahin Ka nang mabuti.`,
   pt:`O Profeta ﷺ aconselhou Mu‘adh (RA) a nunca deixar de dizer após cada oração: “Allahumma a‘inni ‘ala dhikrika wa shukrika wa husni ‘ibadatik” — Ó Allah, ajuda-me a lembrar-Te, a agradecer-Te e a adorar-Te da melhor forma.`,
   es:`El Profeta ﷺ le aconsejó a Mu‘adh (RA) no dejar de decir después de cada oración: “Allahumma a‘inni ‘ala dhikrika wa shukrika wa husni ‘ibadatik” — Oh Allah, ayudame a recordarte, a agradecerte y a adorarte de la mejor manera.`,
   zh:`先知ﷺ嘱咐穆阿兹，每次礼拜后不要忘记念：“主啊，求祢援助我记念祢、感谢祢、并美好地崇拜祢。”`,
   ja:`預言者ﷺはムアーズに、毎回の礼拝の後に欠かさず唱えるよう勧めた。「アッラーフンマ・アイインニー・アラー・ズィクリカ・ワ・シュクリカ・ワ・フスニ・イバーダティク」――アッラーよ、あなたを念じ、感謝し、立派に崇拝できるよう助けたまえ。`,
   id:`Nabi ﷺ berwasiat kepada Mu‘adz (RA) agar tidak meninggalkan doa ini setiap selesai salat: “Allahumma a‘inni ‘ala dzikrika wa syukrika wa husni ‘ibadatik” — Ya Allah, bantulah aku untuk mengingat-Mu, bersyukur kepada-Mu, dan beribadah dengan baik kepada-Mu.`,
   fr:`Le Prophète ﷺ recommanda à Mu‘adh (RA) de ne jamais délaisser après chaque prière : « Allahumma a‘inni ‘ala dhikrika wa shukrika wa husni ‘ibadatik » — Ô Allah, aide-moi à T’évoquer, à Te remercier et à bien T’adorer.`}},
 {id:'s591',col:'muslim',n:591,book:'masajid',nar:'thawban',g:'sahih',ar:`أَسْتَغْفِرُ اللَّهَ ×٣ · اللَّهُمَّ أَنْتَ السَّلاَمُ وَمِنْكَ السَّلاَمُ تَبَارَكْتَ ذَا الْجَلاَلِ وَالإِكْرَامِ`,
  tx:{en:`When the Prophet ﷺ finished his prayer, he sought forgiveness three times and said: “Allahumma antas-salam wa minkas-salam, tabarakta ya dhal-jalali wal-ikram” — O Allah, You are Peace and from You is peace; blessed are You, Owner of Majesty and Honour.`,
   bn:`নামায শেষ করে নবী ﷺ তিনবার ইস্তিগফার করতেন এবং বলতেন: “আল্লাহুম্মা আনতাস সালাম ওয়া মিনকাস সালাম, তাবারাকতা ইয়া যাল জালালি ওয়াল ইকরাম” — হে আল্লাহ, আপনিই শান্তি, আপনার থেকেই শান্তি; আপনি বরকতময়, হে মহিমা ও সম্মানের অধিকারী।`,
   ur:`نماز سے فارغ ہو کر نبی ﷺ تین بار استغفار کرتے اور فرماتے: ”اللہم انت السلام ومنک السلام تبارکت یا ذا الجلال والاکرام“ — اے اللہ! تو سلامتی والا ہے اور تجھ ہی سے سلامتی ہے، تو بابرکت ہے اے جلال و اکرام والے۔`,
   hi:`नमाज़ ख़त्म करके नबी ﷺ तीन बार इस्तिग़फ़ार करते और कहते: “अल्लाहुम्मा अन्तस्सलाम व मिन्कस्सलाम, तबारक्ता या ज़ल-जलालि वल-इकराम” — ऐ अल्लाह, तू ही सलामती है और तुझ ही से सलामती है; तू बरकत वाला है, ऐ जलाल और इकराम वाले।`,
   fil:`Pagkatapos ng salah, humihingi ng tawad ang Propeta ﷺ nang tatlong beses at nagsasabi: “Allahumma antas-salam wa minkas-salam, tabarakta ya dhal-jalali wal-ikram” — O Allah, Ikaw ang Kapayapaan at mula sa Iyo ang kapayapaan; pinagpala Ka, O Nagtataglay ng Kamaharlikaan at Karangalan.`,
   pt:`Ao terminar a oração, o Profeta ﷺ pedia perdão três vezes e dizia: “Allahumma antas-salam wa minkas-salam, tabarakta ya dhal-jalali wal-ikram” — Ó Allah, Tu és a Paz e de Ti vem a paz; bendito sejas, ó Dono da Majestade e da Honra.`,
   es:`Al terminar la oración, el Profeta ﷺ pedía perdón tres veces y decía: “Allahumma antas-salam wa minkas-salam, tabarakta ya dhal-jalali wal-ikram” — Oh Allah, Tú eres la Paz y de Ti viene la paz; bendito seas, Dueño de la Majestad y el Honor.`,
   zh:`先知ﷺ礼拜结束后求饶恕三次，并说：“主啊，祢是和平，和平源自祢；祢多福哉，具有尊严和尊贵的主！”`,
   ja:`預言者ﷺは礼拝を終えると三度赦しを請い、こう唱えた。「アッラーフンマ・アンタッ・サラーム・ワ・ミンカッ・サラーム、タバーラクタ・ヤー・ザル・ジャラーリ・ワル・イクラーム」――アッラーよ、あなたは平安であり、平安はあなたから。威厳と栄誉の主よ、あなたに祝福あれ。`,

function skyCalc(now){
  now=now||Date.now();const st=salState(now),dk=st.today,T=schedFor(dk),rise=T.sunrise,set=T.sunset;
  let mode,from,to;
  if(now>=rise&&now<=set){mode='sun';from=rise;to=set}
  else if(now<rise){mode='moon';from=schedFor(shiftDk(dk,-1)).sunset;to=rise}
  else{mode='moon';from=set;to=schedFor(shiftDk(dk,1)).sunrise}
  const p=Math.max(0,Math.min(1,(now-from)/(to-from)));
  const fajr=now<rise?T.fajr:schedFor(shiftDk(dk,1)).fajr;
  let ph;
  if(mode==='moon')ph=(now<rise&&now>=T.fajr)?'dawn':'night';
  else if(now<rise+45*60000)ph='dawn';
  else if(now>set-60*60000)ph='dusk';
  else ph='day';
  return{st,mode,p,ph,rise,set,from,to,fajr,T};
}

      case 'longoval':x=Math.sin(t)*17;y=-Math.cos(t)*33;break;
      case 'egg':x=Math.sin(t)*24*(1-.16*Math.cos(t));y=-Math.cos(t)*31;break;

    }pts.push([cx+x,cy+y])}

}

    case 'nebula':{for(let k=0;k<7;k++)o+=`<ellipse cx="${R2(28,72)}" cy="${R2(36,88)}" rx="${R2(8,16)}" ry="${R2(4,9)}" fill="${pick()}" opacity="${R2(.35,.65)}" transform="rotate(${R2(-40,40)} 50 62)"/>`;let st='';for(let k=0;k<40;k++)st+=`<circle cx="${R2(22,78)}" cy="${R2(32,92)}" r="${R2(.2,.75)}" fill="#fff" opacity="${R2(.5,1)}"/>`;
      return `<rect x="10" y="20" width="80" height="90" fill="#070A24" opacity=".72"/><g filter="url(#${id}l)" style="mix-blend-mode:screen">${o}</g>${st}`}
    case 'prism':{const cols=A;for(let k=0;k<cols.length;k++)o+=`<rect x="${10+k*16}" y="20" width="18" height="100" fill="${cols[k]}" opacity=".75" transform="rotate(-24 50 62)"/>`;return `<g filter="url(#${id}m)" style="mix-blend-mode:screen">${o}</g>`}
  }return '';
}
function stoneSVG(i,locked,bare){
  const g=GEMS[i],spec=GSPEC[i]||GSPEC[30],r=rng(i*13+7),id='st'+(++stoneId);
  const c=locked?['#4A5068','#2A2E42','#151829']:g.c,d=silhouette(spec[0],r);
  const clearBody=spec[1]==='sunburst'&&!locked;
  return `<svg class="stone" viewBox="${bare?'13 18 74 90':'0 0 100 124'}" aria-hidden="true"><defs>
    <radialGradient id="${id}b" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="${c[0]}" stop-opacity="${clearBody?.55:1}"/><stop offset=".55" stop-color="${c[1]}" stop-opacity="${clearBody?.35:1}"/><stop offset="1" stop-color="${c[2]}" stop-opacity="${clearBody?.6:1}"/></radialGradient>
    <radialGradient id="${id}r" cx=".5" cy=".5" r=".55"><stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="${locked?.25:.42}"/></radialGradient>
    <linearGradient id="${id}p" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2A2D3C"/><stop offset="1" stop-color="#0A0B12"/></linearGradient>
    <clipPath id="${id}c"><path d="${d}"/></clipPath>
    <filter id="${id}s" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation=".55"/></filter>
    <filter id="${id}m" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.3"/></filter>
    <filter id="${id}l" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4.5"/></filter></defs>
    ${bare?'':`<ellipse cx="50" cy="118" rx="28" ry="4.5" fill="rgba(0,0,0,.5)"/><path d="M29 102h42v8c0 3-9 5.5-21 5.5S29 113 29 110z" fill="url(#${id}p)"/><ellipse cx="50" cy="102" rx="21" ry="4" fill="#2C2F40"/><ellipse class="gsh" cx="50" cy="102" rx="13" ry="2.4" fill="${locked?'rgba(0,0,0,.35)':g.c[1]}" opacity="${locked?.6:.55}" filter="url(#${id}m)"/>`}
    ${bare?'':'<g transform="translate(0 -9)"><g class="gfl">'}
    <path d="${d}" fill="url(#${id}b)"/>
    <g clip-path="url(#${id}c)">${locked?'':gemPattern(spec[1],spec[2],r,id)}
      <path d="${d}" fill="url(#${id}r)"/>
      <ellipse cx="39" cy="44" rx="13" ry="7" fill="#fff" opacity="${locked?.06:.5}" transform="rotate(-32 39 44)" filter="url(#${id}l)"/>
      <ellipse cx="40" cy="42" rx="5" ry="2.4" fill="#fff" opacity="${locked?.1:.85}" transform="rotate(-32 40 42)"/>
      <ellipse cx="58" cy="92" rx="14" ry="3" fill="#fff" opacity="${locked?0:.16}" filter="url(#${id}m)"/></g>
    <path d="${d}" fill="none" stroke="rgba(255,255,255,${locked?.12:.35})" stroke-width=".7"/>
    ${locked?`<g transform="translate(41 54)" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="2.2" stroke-linecap="round"><rect x="1" y="8" width="16" height="12" rx="3"/><path d="M4.5 8V5.5a4.5 4.5 0 0 1 9 0V8"/></g>`:''}${bare?'':'</g></g>'}</svg>`;
}
let gsIdx=null;
function gemShowHTML(){
  const cur=lvGemIdx();if(gsIdx==null)gsIdx=cur;
  return `<section class="gemshow" id="gemShow"><div class="gs-glow" id="gsGlow"></div>
    <div class="gs-head"><span>${esc(t('gcT'))}</span><button class="gs-all" id="gsAll"><b id="gsCount"></b> · ${esc(t('gcSee'))} ›</button></div>
    <div class="gs-stage" id="gsStage"><div class="gs-track" id="gsTrack"></div>
      <button class="gs-nav l" id="gsPrev" aria-label="previous">‹</button><button class="gs-nav r" id="gsNext" aria-label="next">›</button></div>
    <div class="gs-info"><b id="gsName"></b><small id="gsSub"></small></div></section>`;
}
const fmtDur=ms=>{const m=Math.max(1,Math.round(ms/60000)),h=Math.floor(m/60),mm=m%60;try{const H=new Intl.NumberFormat(dtLoc(),{style:'unit',unit:'hour',unitDisplay:'short'}),M=new Intl.NumberFormat(dtLoc(),{style:'unit',unit:'minute',unitDisplay:'short'});return h?(H.format(h)+(mm?' '+M.format(mm):'')):M.format(mm)}catch(e){return (h?h+' h ':'')+mm+' min'}};
function msToLevel(L){let ms=Math.max(0,dur(S.lv.n)-S.lv.ms);for(let n=S.lv.n+1;n<L;n++)ms+=dur(n);return ms}
function gsRender(){
  const tr=$('gsTrack');if(!tr)return;const cur=lvGemIdx(),N=GEMS.length,unl=unlockedGems();
  gsIdx=Math.max(0,Math.min(N-1,gsIdx));
  const keep=new Set();
  for(let k=gsIdx-2;k<=gsIdx+2;k++){if(k<0||k>=N)continue;keep.add(String(k));let el=tr.querySelector(`[data-k="${k}"]`);
    if(!el){el=document.createElement('div');el.className='gs-item';el.dataset.k=k;el.innerHTML=stoneSVG(k,k>=unl);el.style.setProperty('--gg',`rgba(${GEMS[k].glow},.55)`);tr.appendChild(el);el.onclick=()=>{gsIdx=k;gsRender()}}
    const off=k-gsIdx;el.style.transform=`translateX(${off*58}%) scale(${off?.56:1})`;el.style.opacity=Math.abs(off)>1?0:off?.7:1;el.style.zIndex=10-Math.abs(off);el.classList.toggle('on',!off);el.classList.toggle('lock',k>=unl)}
  tr.querySelectorAll('.gs-item').forEach(el=>{if(!keep.has(el.dataset.k))el.remove()});
  const g=GEMS[gsIdx],lock=gsIdx>=unl;
  $('gsGlow').style.background=lock?'':`radial-gradient(60% 55% at 50% 42%,rgba(${g.glow},.42),transparent 70%)`;
  $('gsName').textContent=gemName(gsIdx);
  $('gsCount').textContent=fmt(Math.min(unl,N))+' / '+fmt(N);
  let sub='';const L=levelOfGem(gsIdx);
  if(lock)sub=t('gcUnlock',{n:fmt(L)})+' · '+fmtDur(msToLevel(L));
  else if(gsIdx===cur){const nx=Math.min(N-1,cur+1);sub=cur>=N-1&&S.lv.n>=51?t('gcAll'):t('gcNext',{g:gemName(nx),t:fmtDur(msToLevel(levelOfGem(nx)))})}
  else sub=t('level',{n:fmt(L)})+' · '+t('unlocked');
  $('gsSub').textContent=sub;
  $('gsPrev').style.visibility=gsIdx>0?'visible':'hidden';$('gsNext').style.visibility=gsIdx<N-1?'visible':'hidden';
}
function sheetGems(){const unl=unlockedGems(),cur=lvGemIdx();
  open(`<div class="sh"><h2>${esc(t('gcT'))}</h2><span class="tag">${fmt(Math.min(unl,GEMS.length))} / ${fmt(GEMS.length)}</span></div>
    <div class="ggrid">${GEMS.map((g,k)=>{const lock=k>=unl;return `<button class="gcard${lock?' lock':''}${k===cur?' cur':''}" data-k="${k}" style="--gg:rgba(${g.glow},${lock?0:.45})"><div class="gc-art">${stoneSVG(k,lock)}</div><b>${esc(gemName(k))}</b><small>${esc(t('level',{n:fmt(levelOfGem(k))}))}</small></button>`}).join('')}</div>`,
    ()=>{sb.querySelectorAll('.gcard').forEach(b=>b.onclick=()=>{gsIdx=+b.dataset.k;close();gsRender()})});
}
function bindGemShow(){
  if(!$('gsTrack'))return;gsIdx=gsIdx==null?lvGemIdx():gsIdx;gsRender();
  $('gsAll').onclick=sheetGems;
  $('gsPrev').onclick=()=>{gsIdx--;gsRender()};$('gsNext').onclick=()=>{gsIdx++;gsRender()};
  let x0=null;const st=$('gsStage');st.addEventListener('pointerdown',e=>{x0=e.clientX});st.addEventListener('pointerup',e=>{if(x0==null)return;const dx=e.clientX-x0;x0=null;const rtl=document.documentElement.dir==='rtl';if(Math.abs(dx)>40){gsIdx+=((dx<0)!==rtl)?1:-1;gsRender()}});
}
/* ================= DESKTOP SIDE PANEL ================= */
const isDesk=()=>matchMedia('(min-width:1000px)').matches;
function renderSide(){
  const el=$('side');if(!el||!isDesk())return;
  const st=salState(),c=st.cur,d=new Date(),hs=hasStats();
  let h='';try{h=new Intl.DateTimeFormat(dtLoc('islamic-umalqura'),{day:'numeric',month:'long',year:'numeric'}).format(d)}catch(e){}
  el.innerHTML=`<section class="sd-card sd-date"><small>${esc(dfmt(d,{weekday:'long'}))}</small><b>${esc(dfmt(d,{day:'numeric',month:'long',year:'numeric'}))}</b><span>${esc(h)}</span></section>
    <section class="sd-card"><h3>${esc(t('salatTitle'))}</h3>${c?`<div class="sd-now" style="background:${SKY[c.p]}"><b>${esc(pn(c.p))}</b><span id="sdCd"></span></div>`:''}
      ${st.list.map(e=>`<div class="sd-row${c&&c.p===e.p&&c.dk===e.dk?' on':''}"><span>${esc(pn(e.p))}</span><b>${esc(tfmt(e.t))}</b>${e.p!=='sunrise'&&isPrayed(e.dk,e.p)?`<i>${ICO.check}</i>`:'<i></i>'}</div>`).join('')}
      <div class="sd-fb">${forbidWins().map(w=>`<span>${esc(t(w.k))} · ${esc(tfmt(w.a))}–${esc(tfmt(w.b))}</span>`).join('')}</div></section>
    <section class="sd-card sd-has"><h3>${esc(t('hasT'))}</h3><div class="sd-grid"><div><small>${esc(t('today'))}</small><b>${fmt(hs.today*HPD)}</b></div><div><small>${esc(t('days',{n:fmt(7)}))}</small><b>${fmt(hs.week*HPD)}</b></div><div><small>${esc(t('hMonth'))}</small><b>${fmt(hs.month*HPD)}</b></div><div><small>${esc(t('hYear'))}</small><b>${fmt(hs.year*HPD)}</b></div></div></section>
    <p class="sd-kb">${esc(t('kbHint'))}</p>`;
  sideTick(st);
}
function sideTick(st){const k=$('sdCd');if(!k)return;st=st||salState();const c=st.cur;if(!c)return;const [h,m,s2]=hms(c.end-Date.now());k.textContent=`${t('endsIn')} ${fref(h)}:${pad2(m)}:${pad2(s2)}`}
let sideT=0;addEventListener('resize',()=>{clearTimeout(sideT);sideT=setTimeout(renderSide,200)});
/* ================= SALAT EMERGENCY + WELCOME ================= */
const isExcused=(dk,p)=>!!(S.sal&&S.sal.exc&&S.sal.exc[dk]&&S.sal.exc[dk][p]);
const EM_MS=10*60000;
function emActive(st){const c=st&&st.cur,now=Date.now();return !!(c&&!isPrayed(c.dk,c.p)&&!isExcused(c.dk,c.p)&&c.end>now&&c.end-now<=EM_MS)}
function rmEmerg(){const e=$('emerg');if(e){e.remove();document.documentElement.classList.remove('em-on')}}
function emergencyCheck(st){
  if(!emActive(st)){rmEmerg();return}
  const c=st.cur,left=c.end-Date.now(),mm=Math.floor(left/60000),ss=Math.floor(left%60000/1000),clock=fref(mm)+':'+pad2(ss);
  let e=$('emerg');
  if(!e||e.dataset.k!==c.dk+c.p){
    rmEmerg();e=document.createElement('div');e.id='emerg';e.dataset.k=c.dk+c.p;e.setAttribute('role','alertdialog');e.setAttribute('aria-modal','true');
    const ayTx=t('emAyah');
    e.innerHTML=`<div class="em-glow"></div><div class="em-in">
      <div class="em-orb">${MOSQUE}</div>
      <h2>${esc(t('emTitle',{p:pn(c.p)}))}</h2>
      <div class="em-clock" id="emClock">${esc(t('emLeft',{m:clock}))}</div>
      <p class="em-sub">${esc(t('emSub',{p:pn(c.p)}))}</p>
      <div class="em-ay"><p class="em-ar" dir="rtl" lang="ar">﴿إِنَّ الصَّلَاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَّوْقُوتًا﴾</p>${ayTx?`<p class="em-tx">“${esc(ayTx)}”</p>`:''}<small>${esc(t('emRef'))}</small></div>
      <button class="btn em-pray" id="emPray">${MOSQUE}${esc(t('iPrayed',{p:pn(c.p)}))}</button>
      <button class="em-exc" id="emExc">${esc(t('emExc'))}</button></div>`;
    document.body.appendChild(e);document.documentElement.classList.add('em-on');
    try{if(typeof closeWheel==='function')closeWheel();if(typeof closeRadial==='function')closeRadial();if(sheetOpen)close()}catch(_){}
    $('emPray').onclick=()=>{rmEmerg();markPrayed(c.dk,c.p)};
    $('emExc').onclick=()=>{S.sal.exc=S.sal.exc||{};(S.sal.exc[c.dk]=S.sal.exc[c.dk]||{})[c.p]=1;save();rmEmerg();renderSalStrip();if(curTab==='salat')renderSalat()};
    tick(true);
  }else{const k=$('emClock');if(k)k.textContent=t('emLeft',{m:clock})}
}
function showWelcome(){
  if($('welcome')||S.welcomed===dayKey()||emActive(salState()))return;
  const w=document.createElement('div');w.id='welcome';w.setAttribute('role','dialog');w.setAttribute('aria-modal','true');
  const tx=t('wAyah');
  w.innerHTML=`<div class="wl-in"><div class="wl-orb">${ICONS.lantern}</div>
    <h2>${esc(t('greet'))}</h2><p class="wl-sub">${esc(t('wSub'))}</p>
    <div class="wl-ay"><p class="wl-ar" dir="rtl" lang="ar">﴿الَّذِينَ آمَنُوا وَتَطْمَئِنُّ قُلُوبُهُم بِذِكْرِ اللَّهِ ۗ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾</p>${tx?`<p class="wl-tx">“${esc(tx)}”</p>`:''}
      <a href="https://quran.com/13/28" target="_blank" rel="noopener">${esc(t('wRef'))}</a></div>
    <button class="btn wl-go" id="wlGo">${esc(t('wBtn'))}</button></div>`;
  document.body.appendChild(w);
  $('wlGo').onclick=()=>{S.welcomed=dayKey();save();w.classList.add('out');setTimeout(()=>w.remove(),320)};
}
/* ================= WIRE ================= */
function renderAll(){setTimeout(renderSide,0);ensureSal();applyLang();renderHeader();renderChips();renderMain();lvCache='';renderLevel(false);renderSalStrip();setTimeout(fitCount,0)}
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;if(b.dataset.more)openWheel();else select(b.dataset.id)});
$('phrase').onclick=openWheel;$('pickBtn').onclick=openWheel;$('bMode').onclick=()=>setMode(S.mode==='orb'?'beads':'orb');
document.querySelectorAll('#modePill button').forEach(b=>b.onclick=e=>{e.stopPropagation();setMode(b.dataset.m)});
$('round').onclick=sheetTarget;$('bTarget').onclick=sheetTarget;
$('bUndo').onclick=undo;$('bReset').onclick=reset;$('bSave').onclick=saveSession;
$('bManual').onclick=sheetManual;$('bLang').onclick=sheetLang;
$('lvl').onclick=()=>{gsIdx=lvGemIdx();go('streak')};$('statPill').onclick=()=>{hPer='today';go('stats');const c=$('hasCard');if(c)c.scrollIntoView({block:'start'})};
$('salStrip').onclick=e=>{const st=salState();if(e.target.closest('#ssBtn')&&st.cur)markPrayed(st.cur.dk,st.cur.p);else go('salat')};
setInterval(tickSalat,1000);
setTimeout(()=>{emergencyCheck(salState());showWelcome();const hh=$('handHint');if(hh&&!(S.daily[dayKey()]>0)){hh.hidden=false;hh.classList.toggle('orb',S.mode==='orb');$('hhTx').textContent=S.mode==='orb'?t('tapHint2'):t('tapHint')}},700);
document.addEventListener('pointerdown',e=>{if(!S.set.click)return;const b=e.target.closest('button,.chip,[role=switch]');if(b&&!b.disabled&&!b.closest('#bsQ'))beadSound(.55)},true);
$('virtue').onclick=()=>{const d=cur();if(d.h)sheetHadith(HMAP[d.h[0]])};
document.addEventListener('keydown',e=>{
  if($('emerg')||$('welcome'))return;
  if(e.key==='Escape'&&($('wheel')||$('radial'))){closeWheel();closeRadial();return}
  if(e.key==='Escape'){if($('celebrate').innerHTML){$('cGo')&&$('cGo').click();return}if(sheetOpen){close();return}}
  if(sheetOpen||curTab!=='count'||$('celebrate').innerHTML||e.target.closest('input,button,a,[role=button]'))return;
  if(e.key===' '||e.key==='Enter'||e.key==='ArrowUp'){e.preventDefault();inc()}
  else if(e.key==='Backspace'||e.key==='ArrowDown'){e.preventDefault();undo()}
});
(function repairV1(){
  if(S.fixV1)return; const cut='2026-10-22',cutTs=new Date(cut+'T00:00').getTime(); let removed=0;
  for(const k of Object.keys(S.daily)){if(k<cut&&!S.dayDhikr[k]){removed+=S.daily[k];delete S.daily[k];delete S.time[k]}}
  S.sessions=S.sessions.filter(x=>!(x.ts<cutTs&&!x.manual&&!byId(x.name)));
  if(removed){S.pts=Math.max(0,S.pts-removed*10);for(const b of BADGES)if(S.badges[b.id]&&!earned(b))delete S.badges[b.id]}
  S.fixV1=1;save();
})();
if(window.TASBIH_STANDALONE){const bt=document.querySelector('.tab[data-tab="board"]');if(bt)bt.hidden=true;
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}
applyTheme();renderAll();checkBadges(true);
setInterval(renderHeader,60000);
})();

</script>
