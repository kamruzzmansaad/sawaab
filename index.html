<style>.nlf .tabbar{padding-bottom:62px}

.sal-hero .orb2{top:-64px;inset-inline-end:-64px;width:190px;height:190px}

.sal-hero .orb2.sun{background:radial-gradient(circle closest-side at 50% 50%,rgba(255,240,200,.65) 0 22%,rgba(255,215,140,.25) 52%,transparent 100%)}
.sal-hero .hij{text-shadow:0 1px 8px rgba(0,0,0,.35);max-width:58%}
.sal-hero .sal-top{z-index:2}
/* v7: sky widget */
.skyw{position:relative;overflow:hidden;height:178px;margin-top:14px;border-radius:30px;color:#fff;isolation:isolate;
  border:5px solid rgba(255,255,255,.16);background-clip:padding-box;transition:background .8s,box-shadow .8s}
html:not([data-theme=dark]) .skyw{border-color:rgba(255,255,255,.9)}
@media (prefers-color-scheme:dark){html:not([data-theme=light]) .skyw{border-color:rgba(255,255,255,.16)}}
.skyw.ph-night{background:radial-gradient(120% 90% at 70% 100%,#3A3550 0%,#141420 45%,#050508 100%);box-shadow:0 18px 44px rgba(0,0,0,.45),0 0 60px rgba(180,170,255,.18)}
.skyw.ph-dawn{background:radial-gradient(90% 80% at 15% 100%,#FFB27A 0%,transparent 60%),linear-gradient(170deg,#8E6CC6 0%,#D47A9B 45%,#F2876E 100%);box-shadow:0 18px 44px rgba(232,120,110,.35),0 0 70px rgba(255,150,120,.3)}
.skyw.ph-day{background:radial-gradient(80% 70% at 50% 110%,#6FB6FF 0%,transparent 70%),linear-gradient(150deg,#3E8BFF 0%,#6F8DFF 50%,#C49BFF 100%);box-shadow:0 18px 44px rgba(70,120,255,.35),0 0 70px rgba(160,140,255,.35)}
.skyw.ph-dusk{background:radial-gradient(90% 80% at 85% 100%,#FFB070 0%,transparent 60%),linear-gradient(170deg,#4B3F9E 0%,#B0629E 50%,#F08A5D 100%);box-shadow:0 18px 44px rgba(200,100,120,.35),0 0 70px rgba(255,140,100,.28)}
.skyhead{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 18px 0}
.skyhead b{display:block;font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.skyhead small{display:block;font-size:12px;opacity:.72;margin-top:3px;font-variant-numeric:tabular-nums}
.skyclock{font-family:var(--display);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;opacity:.95;white-space:nowrap}
.skyarc{position:absolute;left:0;right:0;bottom:-6px;width:100%;height:150px;z-index:1;overflow:visible}
.skyw .o-halo{transform-box:fill-box;transform-origin:center;animation:oHalo 3.2s ease-in-out infinite}
.skyw .o-rays{animation:oRays 24s linear infinite}
.skyw .o-core{filter:drop-shadow(0 0 8px rgba(255,240,210,.9))}
.skyw.ph-night .o-core{filter:drop-shadow(0 0 10px rgba(235,235,255,.95))}
@keyframes oHalo{0%,100%{transform:scale(.85);opacity:.85}50%{transform:scale(1.15);opacity:1}}
@keyframes oRays{to{transform:rotate(360deg)}}
.skystars{position:absolute;inset:0;z-index:0;pointer-events:none}
.skystars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation:tw 3s ease-in-out infinite}
.skystars i:nth-child(1){left:12%;top:58%}.skystars i:nth-child(2){left:28%;top:30%;animation-delay:.6s}.skystars i:nth-child(3){left:46%;top:18%;animation-delay:1.2s;width:3px;height:3px}
.skystars i:nth-child(4){left:62%;top:40%;animation-delay:1.8s}.skystars i:nth-child(5){left:78%;top:22%;animation-delay:.3s}.skystars i:nth-child(6){left:88%;top:52%;animation-delay:2.2s;width:3px;height:3px}
.skystars i:nth-child(7){left:36%;top:64%;animation-delay:1.5s}.skystars i:nth-child(8){left:70%;top:68%;animation-delay:.9s}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
/* hero orb motion */
.orb2{animation:orbFloat 7s ease-in-out infinite}
.orb2.sun{animation:orbFloat 7s ease-in-out infinite,orbGlow 3.4s ease-in-out infinite}
.orb2.moon{animation:orbFloat 8s ease-in-out infinite,orbGlowM 4s ease-in-out infinite}
@keyframes orbFloat{50%{transform:translate(-6px,8px)}}
@keyframes orbGlow{50%{filter:brightness(1.18) blur(.3px)}}
@keyframes orbGlowM{50%{filter:brightness(1.25)}}
.stars2{animation:starsTw 5s ease-in-out infinite}
@keyframes starsTw{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.skyw *,.orb2,.stars2{animation:none!important}}

/* v8: milestones + reward pill */
.miles{grid-template-columns:repeat(5,1fr)!important;gap:7px}
button.mile{position:relative;color:var(--fg);cursor:pointer;transition:transform .15s,border-color .2s,background .2s}
button.mile:active{transform:scale(.95)}
.mile.sel{border:1.5px dashed var(--gold);background:var(--gold-soft)}
.mile.sel b{color:var(--gold)}
.mile.got .mck{position:absolute;top:-6px;inset-inline-end:-6px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--good);color:#fff}
.mile.got .mck svg{width:11px;height:11px}
.miles+.goalbar{margin-top:14px}
.rwpill{position:relative;display:flex;gap:12px;align-items:flex-start;margin-top:14px;max-width:min(380px,92%);padding:12px 14px;border-radius:20px;text-align:start;
  background:linear-gradient(135deg,rgba(255,214,140,.16),rgba(255,214,140,.06));border:1px solid rgba(255,214,140,.28);box-shadow:0 0 30px rgba(255,200,120,.12)}
.rwpill .rwic{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,214,140,.2);color:var(--gold)}
.rwpill .rwic svg{width:15px;height:15px}
.rwpill.got .rwic{background:var(--gold);color:#1B1F4A;box-shadow:0 0 16px rgba(255,200,120,.6)}
.rwtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rwtx small{font-size:12px;font-weight:600;color:color-mix(in srgb,var(--gold) 75%,var(--fg));letter-spacing:.01em}
.rwtx b{font-size:14.5px;line-height:1.35;color:var(--gold);font-weight:700}
.rwbar{display:block;height:5px;border-radius:3px;background:var(--glass2);margin-top:6px;overflow:hidden}
.rwbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#E9B65C,#FFE1A0);box-shadow:0 0 10px rgba(255,210,130,.7)}
.rwtx em{font-style:normal;font-size:11.5px;color:var(--fg3);font-variant-numeric:tabular-nums}

.stage canvas{top:-90px!important;bottom:-26px!important;height:auto!important;pointer-events:none}
#v-count .hero,#v-count .lvl,#v-count .salstrip,#v-count .top{position:relative;z-index:2}

/* v9: hasanat, credits, meaning, round pill */
.hascard{position:relative;overflow:hidden;border-radius:28px;padding:16px 16px 12px;margin-bottom:12px;color:#fff;
  background:radial-gradient(120% 90% at 100% 0%,rgba(255,214,140,.30),transparent 55%),linear-gradient(150deg,#2B2370 0%,#4A2F8F 55%,#7A3E86 100%);
  border:1px solid rgba(255,255,255,.14);box-shadow:0 16px 40px rgba(40,25,110,.35)}
.hascard::after{content:"";position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle closest-side,rgba(255,226,160,.45),transparent);pointer-events:none;animation:orbGlow 4s ease-in-out infinite}
.hc-top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hc-top small{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#FFE1A0}
.hc-sub{display:block;font-size:12px;opacity:.7;margin-top:2px}
.hc-info{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);color:#fff;font-weight:800;font-size:14px}
.hc-num{position:relative;z-index:1;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:8px 0 12px}
.hc-num b{font-family:var(--display);font-size:44px;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#FFF6DD,#F4C76A);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,205,120,.35))}
.hc-num span{font-size:13px;opacity:.75;font-variant-numeric:tabular-nums}
.hc-seg{position:relative;z-index:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px 12px;padding:0 2px}
.hc-seg::-webkit-scrollbar{display:none}
.hc-seg button{flex:none;height:30px;padding:0 12px;border-radius:15px;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.75);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1)}
.hc-seg button.on{background:#fff;color:#2B2370;border-color:transparent}
.hbars{position:relative;z-index:1;display:flex;align-items:flex-end;gap:3px;height:96px}
.hb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.hb i{display:block;width:100%;max-width:16px;border-radius:6px 6px 3px 3px;background:rgba(255,255,255,.28)}
.hb.on i{background:linear-gradient(180deg,#FFE7AE,#E9B65C);box-shadow:0 0 12px rgba(255,205,120,.55)}
.hb em{font-style:normal;font-size:9.5px;opacity:.6;height:12px;line-height:12px;white-space:nowrap}
.hb.on em{opacity:1;color:#FFE1A0;font-weight:700}
.hlist{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px}
.hrow{display:grid;grid-template-columns:minmax(0,38%) 1fr auto;align-items:center;gap:10px;font-size:12.5px}
.hrow .hn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.hrow .ht{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.hrow .ht i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#E9B65C,#FFE7AE)}
.hrow b{font-variant-numeric:tabular-nums;color:#FFE1A0}
.hc-rw{position:relative;z-index:1;display:flex;align-items:center;gap:8px;width:100%;margin-top:12px;padding:10px 2px 2px;border-top:1px solid rgba(255,255,255,.12);color:#fff;font-size:13px;font-weight:700;text-align:start}
.hc-rw span{flex:1}.hc-rw svg{width:15px;height:15px;color:#FFE1A0}.hc-rw .chev{color:rgba(255,255,255,.6)}
.credits{margin:28px 6px 56px;padding-top:18px;border-top:1px dashed var(--stroke);text-align:center;color:var(--fg3)}
.cr-heart{width:26px;height:26px;margin:0 auto 6px;color:#E86A86;opacity:.75;animation:breathe 2.6s ease-in-out infinite}
.cr-heart svg{width:100%;height:100%}
.cr-made{margin:0;font-size:12.5px;font-weight:700;color:var(--fg2)}
.cr-msg{margin:6px auto 0;font-size:11.5px;line-height:1.55;max-width:36ch}
.cr-had{margin:14px auto 0;max-width:38ch;padding:12px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--stroke)}
.cr-had small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3)}
.cr-ar{margin:6px 0 0;font-family:var(--arabic);font-size:15px;line-height:1.9;color:var(--fg2)}
.cr-tx{margin:4px 0 0;font-size:11.5px;line-height:1.55}
.cr-ref{display:inline-block;margin-top:6px;font-size:10.5px;color:var(--accent);text-decoration:none}
/* meaning always visible, round pill smaller */
#v-count .mean,#v-count.c1 .mean,#v-count.c2 .mean,#v-count.c3 .mean{display:-webkit-box!important;-webkit-line-clamp:2;margin-top:2px;font-size:12.5px}
#v-count.c2 .mean,#v-count.c3 .mean{-webkit-line-clamp:1;font-size:12px}
@media (max-height:700px){#v-count .mean{display:-webkit-box!important;-webkit-line-clamp:1}}
.hero .round{height:26px!important;padding:0 10px!important;font-size:11.5px!important;border-radius:13px!important;gap:4px}
.hero .round svg{width:9px;height:9px}
.hero{padding-top:44px!important}
#v-count.c1 .hero,#v-count.c2 .hero,#v-count.c3 .hero{padding-top:42px!important}
.hero .pickbtn{width:28px;height:28px;top:9px}
.hero .pickbtn svg{width:14px;height:14px}

<style>
/* Layout: one-screen app — glass views over a blue night glow; floating glass tab bar; bottom sheets + badge celebration overlay */
:root{
  --bg:#060A18; --glow1:rgba(74,108,255,.55); --glow2:rgba(132,94,247,.38);
  --glass:rgba(255,255,255,.06); --glass2:rgba(255,255,255,.11); --stroke:rgba(255,255,255,.10);
  --hero:linear-gradient(165deg,rgba(116,146,255,.32),rgba(120,100,255,.10) 45%,rgba(255,255,255,.03));
  --fg:#F3F5FF; --fg2:rgba(222,228,255,.66); --fg3:rgba(222,228,255,.34);
  --accent:#93ACFF; --accent-ink:#0A1030; --accent-soft:rgba(147,172,255,.16);
  --gold:#EEC86F; --gold2:#C8912C; --gold-soft:rgba(238,200,111,.15);
  --good:#5CD8A0; --good-soft:rgba(92,216,160,.14); --danger:#FF6F6F;
  --cta:#F3F5FF; --cta-ink:#0A1030;
  --sheet:rgba(15,21,46,.92); --scrim:rgba(2,4,14,.6); --tab:rgba(16,22,48,.72);
  --ray:rgba(147,172,255,.13);
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Plus Jakarta Sans","Hind Siliguri","Hind","Noto Naskh Arabic","PingFang SC","Hiragino Sans","Microsoft YaHei",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Plus Jakarta Sans","Hind Siliguri","Hind","Noto Naskh Arabic","PingFang SC","Hiragino Sans",system-ui,sans-serif;
  --arabic:"Amiri","Noto Naskh Arabic","Geeza Pro",serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#E8EFFB; --glow1:rgba(84,140,255,.55); --glow2:rgba(160,200,255,.7);
  --glass:rgba(255,255,255,.62); --glass2:rgba(255,255,255,.88); --stroke:rgba(20,40,100,.08);
  --hero:linear-gradient(165deg,rgba(110,160,255,.42),rgba(255,255,255,.72) 55%);
  --fg:#0B1531; --fg2:rgba(11,21,49,.62); --fg3:rgba(11,21,49,.32);
  --accent:#2A5FE6; --accent-ink:#FFFFFF; --accent-soft:rgba(42,95,230,.10);
  --gold:#B07E1E; --gold2:#8A5E12; --gold-soft:rgba(176,126,30,.12);
  --good:#178A55; --good-soft:rgba(23,138,85,.10); --danger:#D63B33;
  --cta:#0B1531; --cta-ink:#FFFFFF;
  --sheet:rgba(246,249,255,.94); --scrim:rgba(10,20,50,.28); --tab:rgba(255,255,255,.74);
  --ray:rgba(42,95,230,.08);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#E8EFFB; --glow1:rgba(84,140,255,.55); --glow2:rgba(160,200,255,.7);
  --glass:rgba(255,255,255,.62); --glass2:rgba(255,255,255,.88); --stroke:rgba(20,40,100,.08);
  --hero:linear-gradient(165deg,rgba(110,160,255,.42),rgba(255,255,255,.72) 55%);
  --fg:#0B1531; --fg2:rgba(11,21,49,.62); --fg3:rgba(11,21,49,.32);
  --accent:#2A5FE6; --accent-ink:#FFFFFF; --accent-soft:rgba(42,95,230,.10);
  --gold:#B07E1E; --gold2:#8A5E12; --gold-soft:rgba(176,126,30,.12);
  --good:#178A55; --good-soft:rgba(23,138,85,.10); --danger:#D63B33;
  --cta:#0B1531; --cta-ink:#FFFFFF;
  --sheet:rgba(246,249,255,.94); --scrim:rgba(10,20,50,.28); --tab:rgba(255,255,255,.74);
  --ray:rgba(42,95,230,.08);
  color-scheme:light;
}
html[lang="ja"]{--ui:-apple-system,BlinkMacSystemFont,"Plus Jakarta Sans","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif}
html[lang="ar"],html[lang="ur"]{--ui:"Noto Naskh Arabic",-apple-system,"Plus Jakarta Sans",system-ui,sans-serif}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;color:var(--fg);font-family:var(--ui);font-size:15px;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;
  background:radial-gradient(120% 55% at 50% -14%,var(--glow1),transparent 62%),radial-gradient(70% 40% at 105% 2%,var(--glow2),transparent 60%),var(--bg);
  background-color:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;color:var(--fg);-webkit-user-select:text;user-select:text}
svg{flex:none}
.prose{line-height:1.6}
html[lang="ur"] .prose{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic",serif;line-height:2.15;font-size:.95em}
.num-font{font-family:var(--display);font-variant-numeric:tabular-nums}

.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
.views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px 18px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.enter{animation:fadeUp .35s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeUp{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}

.glass{background:var(--glass);border:1px solid var(--stroke);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.top .hi{margin:0;font-size:13px;font-weight:600;color:var(--fg2)}
.top .dt{margin:2px 0 0;font-size:12px;color:var(--fg3)}
.top-actions{display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--fg);transition:transform .15s}
.icon-btn svg{width:19px;height:19px}
.icon-btn:active,.pill-btn:active{transform:scale(.93)}
.pill-btn{height:40px;padding:0 14px 0 12px;border-radius:20px;display:flex;align-items:center;gap:7px;font-weight:600;font-size:13.5px;transition:transform .15s}
.pill-btn svg{width:17px;height:17px;color:var(--accent)}
h1.vt{margin:6px 0 2px;font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.vsub{margin:0 0 14px;color:var(--fg2);font-size:13.5px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 2px;margin-inline:-2px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:17px;font-size:13.5px;font-weight:600;white-space:nowrap;transition:background .2s,color .2s}
.chip .n{font-variant-numeric:tabular-nums;color:var(--fg3);font-weight:600;font-size:12.5px}
.chip.on{background:var(--cta);color:var(--cta-ink);border-color:transparent}
.chip.on .n{color:var(--cta-ink);opacity:.6}
.chip.more{color:var(--accent)}
.chip.more svg{width:14px;height:14px}

/* hero */
.hero{flex:none;margin-top:12px;border-radius:28px;padding:16px 16px 14px;background:var(--hero);border:1px solid var(--stroke);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.phrase{display:block;width:100%;text-align:center}
.ar{margin:0;font-family:var(--arabic);font-size:30px;line-height:1.6;direction:rtl}
.ar.long{font-size:22px}.ar.xl{font-size:18px;line-height:1.7}
.tr{margin:2px 0 0;font-size:14px;font-weight:600;color:var(--fg)}
.mean{margin:2px auto 0;font-size:12.5px;color:var(--fg2);max-width:40ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
html[lang="ur"] .mean{line-height:2;font-size:12px}
.countblock{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:8px}
.num{font-family:var(--display);font-size:68px;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,var(--fg) 30%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;transition:transform .12s ease-out}
.num.bump{transform:scale(1.05)}
.round{position:relative;overflow:hidden;height:30px;padding:0 14px;border-radius:15px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;background:var(--glass2);border:1px solid var(--stroke)}
.round .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--gold-soft);transition:width .25s}
html[dir="rtl"] .round .fill{inset:0 0 0 auto}
.round span,.round svg{position:relative}
.round svg{width:11px;height:11px;color:var(--fg2)}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.act{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:500;color:var(--fg2)}
.act i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--glass2);border:1px solid var(--stroke);color:var(--fg);transition:transform .15s,background .2s}
.act i svg{width:19px;height:19px}
.act:active i{transform:scale(.9)}
.act.warn i{background:var(--danger);color:#fff;border-color:transparent}
.act.warn{color:var(--danger)}
.act.save i{background:var(--cta);color:var(--cta-ink);border-color:transparent}

/* stage */
.stage{flex:1;min-height:150px;position:relative;touch-action:none;cursor:pointer;margin-inline:-16px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.hint{position:absolute;inset-inline-end:20px;bottom:4px;margin:0;font-size:11.5px;color:var(--fg3);pointer-events:none}
.virtue{flex:none;display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:18px;text-align:start}
.virtue .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--good-soft);color:var(--good)}
.virtue .ic svg{width:17px;height:17px}
.virtue .tx{flex:1;min-width:0}
.virtue b{display:block;font-size:13px;font-weight:600}
.virtue small{display:block;font-size:12px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:16px;height:16px;color:var(--fg3)}
html[dir="rtl"] .chev{transform:scaleX(-1)}

/* tab bar */
.tabbar{flex:none;padding:6px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-radius:26px;padding:6px;background:var(--tab);border:1px solid var(--stroke);-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);box-shadow:0 12px 34px rgba(0,0,0,.22)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:20px;font-size:11px;font-weight:600;color:var(--fg3);transition:color .2s,background .2s}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent);background:var(--accent-soft)}

/* streak */
.flame-hero{text-align:center;padding:4px 0 18px}
.orb{position:relative;width:160px;height:160px;margin:0 auto}
.orb .ring{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(var(--gold) 0 1.2deg,transparent 1.2deg 7deg);
  -webkit-mask:radial-gradient(circle,transparent 63%,#000 64%,#000 67%,transparent 68%);mask:radial-gradient(circle,transparent 63%,#000 64%,#000 67%,transparent 68%);opacity:.55;animation:spin 40s linear infinite}
.orb .glow{position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle,rgba(240,150,50,.45),transparent 70%)}
.orb svg{position:absolute;inset:22%;width:56%;height:56%;filter:drop-shadow(0 8px 18px rgba(240,130,40,.45))}
@keyframes spin{to{transform:rotate(360deg)}}
.big{font-family:var(--display);font-size:64px;font-weight:800;line-height:1;margin-top:2px;font-variant-numeric:tabular-nums}
.big-l{font-weight:700;font-size:16px;margin-top:6px}
.big-s{color:var(--fg2);font-size:13.5px;margin-top:6px}
.card{border-radius:24px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 12px;font-size:12px;font-weight:700;color:var(--fg2);letter-spacing:.06em;text-transform:uppercase}
.week{display:grid;grid-template-columns:repeat(7,1fr);row-gap:10px}
.wd{text-align:center;font-size:11.5px;font-weight:600;color:var(--fg2)}
.wd.now{color:var(--gold)}
.wc{position:relative;height:36px;display:grid;place-items:center}
.wc .dot{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--fg3);font-variant-numeric:tabular-nums}
.wc.on .dot{background:linear-gradient(160deg,#FFD98A,#E8962E);color:#3A2206;box-shadow:0 4px 12px rgba(232,150,46,.35)}
.wc.on .dot svg{width:15px;height:15px}
.wc.today:not(.on) .dot{border:1.5px dashed var(--gold);color:var(--gold)}
.wc.l::before,.wc.r::after{content:"";position:absolute;top:6px;bottom:6px;background:linear-gradient(90deg,rgba(232,150,46,.28),rgba(232,150,46,.28))}
.wc.l::before{inset-inline-start:0;inset-inline-end:50%}
.wc.r::after{inset-inline-start:50%;inset-inline-end:0}
.miles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mile{border-radius:16px;padding:10px 6px;text-align:center;border:1px solid var(--stroke);background:var(--glass)}
.mile b{display:block;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.mile small{display:block;font-size:11px;color:var(--fg2);margin-top:2px}
.mile.done{opacity:.5}
.mile.done b{text-decoration:line-through}
.mile.next{border:1.5px dashed var(--gold);background:var(--gold-soft)}
.mile.next b{color:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.tile{border-radius:20px;padding:12px}
.tile small{display:block;font-size:11.5px;color:var(--fg2);font-weight:600}
.tile b{display:block;font-family:var(--display);font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px 12px}
.sec h2{margin:0;font-size:19px;font-weight:700;font-family:var(--display)}
.sec span{font-size:13px;color:var(--fg2);font-variant-numeric:tabular-nums}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bcell{border-radius:20px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.bcell span{font-size:11.5px;font-weight:600;line-height:1.3;color:var(--fg)}
.bcell.lock span{color:var(--fg3)}

/* badge art */
.bart{--s:56px;width:var(--s);height:calc(var(--s)*1.08);position:relative;display:grid;place-items:center;filter:drop-shadow(0 6px 14px var(--bsh,rgba(0,0,0,.25)))}
.bart::before{content:"";position:absolute;inset:0;clip-path:polygon(50% 0,93% 24%,93% 76%,50% 100%,7% 76%,7% 24%);background:linear-gradient(160deg,var(--b1),var(--b2))}
.bart::after{content:"";position:absolute;inset:9%;clip-path:polygon(50% 0,93% 24%,93% 76%,50% 100%,7% 76%,7% 24%);background:linear-gradient(200deg,rgba(255,255,255,.35),rgba(255,255,255,0) 55%);}
.bart svg{position:relative;z-index:1;width:46%;height:46%;color:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.bart.lock{filter:none}
.bart.lock::before{background:var(--glass2);}
.bart.lock::after{background:none}
.bart.lock svg{color:var(--fg3);filter:none}

/* hadith list */
.hcard{display:block;width:100%;text-align:start;border-radius:22px;padding:14px;margin-bottom:10px;transition:transform .15s}
.hcard:active{transform:scale(.985)}
.hmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font-size:11.5px;font-weight:600;background:var(--glass2);border:1px solid var(--stroke);white-space:nowrap}
.tag.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
.tag svg{width:12px;height:12px}
.hcard h4{margin:10px 0 2px;font-size:15px;font-weight:700}
.hcard .harr{font-family:var(--arabic);font-size:17px;color:var(--fg2);direction:rtl;margin:0}
.hcard p.hx{margin:6px 0 0;font-size:13.5px;color:var(--fg2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:12px;color:var(--fg3)}

/* stats */
.shero{border-radius:26px;padding:16px;display:flex;align-items:center;gap:14px;background:var(--hero);border:1px solid var(--stroke);margin-bottom:12px}
.shero small{display:block;font-size:12.5px;color:var(--fg2);font-weight:600}
.shero b{display:block;font-family:var(--display);font-size:38px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.shero .grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:42px;padding:0 18px;border-radius:21px;background:var(--cta);color:var(--cta-ink);font-weight:700;font-size:14px;white-space:nowrap;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px}
.btn.block{display:flex;width:100%;height:54px;border-radius:27px;font-size:16px;margin-top:18px}
.btn.ghost{background:var(--glass2);color:var(--fg);border:1px solid var(--stroke)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--stroke)}
.seg{display:flex;background:var(--glass);border:1px solid var(--stroke);border-radius:14px;padding:3px;margin-bottom:12px}
.seg button{flex:1;height:34px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--fg2)}
.seg button.on{background:var(--cta);color:var(--cta-ink)}
.chart{border-radius:22px;padding:16px 12px 10px}
.bars{display:flex;align-items:flex-end;gap:5px;height:150px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;min-width:0}
.bar i{display:block;width:100%;max-width:18px;border-radius:7px 7px 4px 4px;background:linear-gradient(180deg,var(--fg3),transparent);min-height:3px}
.bar.today i{background:linear-gradient(180deg,var(--gold),rgba(200,145,44,.25))}
.bar em{font-style:normal;font-size:10px;color:var(--fg3);font-variant-numeric:tabular-nums}
.bar.today em{color:var(--gold);font-weight:700}
.bar .v{font-size:10px;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.group{border-radius:20px;overflow:hidden;margin-bottom:12px}
.lrow{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:start;position:relative}
.lrow + .lrow::before{content:"";position:absolute;top:0;inset-inline-start:14px;inset-inline-end:0;height:1px;background:var(--stroke)}
.lrow .tx{flex:1;min-width:0}
.lrow .tx b{display:block;font-size:14.5px;font-weight:600}
.lrow .tx small{display:block;font-size:12.5px;color:var(--fg2);margin-top:2px}
.lrow .val{color:var(--fg2);font-size:14px}
.badge-n{flex:none;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--gold);background:var(--gold-soft);padding:4px 10px;border-radius:10px}
.sw{flex:none;width:51px;height:31px;border-radius:16px;background:var(--glass2);border:1px solid var(--stroke);position:relative;transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .25s}
.sw[aria-checked="true"]{background:var(--good);border-color:transparent}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
html[dir="rtl"] .sw[aria-checked="true"]::after{transform:translateX(-20px)}
.note{font-size:12.5px;color:var(--fg2);margin:4px 4px 12px;line-height:1.55}
.sample{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--gold);background:var(--gold-soft);border-radius:10px;padding:4px 10px;margin-bottom:10px}
.empty{text-align:center;padding:30px 12px;color:var(--fg2);font-size:14px}
.empty svg{width:40px;height:40px;color:var(--fg3);display:block;margin:0 auto 10px}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;max-height:88%;z-index:21;background:var(--sheet);
  -webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);border:1px solid var(--stroke);border-bottom:0;
  border-radius:28px 28px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .4s cubic-bezier(.32,.72,0,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.grab{flex:none;height:24px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab::before{content:"";width:38px;height:5px;border-radius:3px;background:var(--fg3)}
.sb{overflow-y:auto;padding:0 max(18px,env(safe-area-inset-right,0px)) 22px max(18px,env(safe-area-inset-left,0px))}
.sh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:4px 0 14px}
.sh h2{margin:0;font-family:var(--display);font-size:22px;font-weight:800;text-wrap:balance}
.sh p{margin:3px 0 0;font-size:13px;color:var(--fg2)}
.link{color:var(--accent);font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.link svg{width:16px;height:16px}
.drow{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:start;position:relative}
.drow + .drow::before{content:"";position:absolute;top:0;inset-inline-start:52px;inset-inline-end:0;height:1px;background:var(--stroke)}
.check{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--fg3);display:grid;place-items:center}
.drow.on .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check svg{width:14px;height:14px;opacity:0}
.drow.on .check svg{opacity:1}
.drow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.drow .a{font-family:var(--arabic);font-size:20px;line-height:1.55;direction:rtl;text-align:start}
html[dir="ltr"] .drow .a{text-align:left}
.drow .b{font-size:14.5px;font-weight:600}
.drow .c{font-size:12.5px;color:var(--fg2);line-height:1.4}
.pillnum{flex:none;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg2);background:var(--glass2);padding:4px 9px;border-radius:9px}
.del{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--danger)}
.del svg{width:16px;height:16px}
.field{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.field label{font-size:13px;font-weight:600;color:var(--fg2)}
.field input{height:48px;border-radius:14px;border:1px solid var(--stroke);background:var(--glass);padding:0 14px;font-size:16px;outline:none;width:100%}
.field input.ar-in{font-family:var(--arabic);direction:rtl;font-size:19px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick button{height:40px;padding:0 15px;border-radius:14px;background:var(--glass2);border:1px solid var(--stroke);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.quick button.on{background:var(--cta);color:var(--cta-ink);border-color:transparent}
.err{color:var(--danger);font-size:13px;margin:8px 0 0;min-height:1em}
.lang-row .code{flex:none;min-width:38px;height:28px;padding:0 8px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--glass2)}
/* hadith detail */
.matn{border-radius:20px;padding:16px;font-family:var(--arabic);font-size:22px;line-height:1.9;direction:rtl;text-align:right;-webkit-user-select:text;user-select:text}
.trans{margin:14px 2px 0;font-size:15px;-webkit-user-select:text;user-select:text}
.dl{display:grid;grid-template-columns:auto 1fr;gap:0;border-radius:20px;overflow:hidden;margin-top:14px}
.dl dt,.dl dd{margin:0;padding:11px 14px;font-size:13.5px;border-top:1px solid var(--stroke)}
.dl dt{color:var(--fg2);font-weight:600;white-space:nowrap}
.dl dd{font-weight:600;text-align:end;min-width:0}
.dl dt:first-of-type,.dl dd:first-of-type{border-top:0}
.refs{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.refs a{text-decoration:none}
.refs .tag{height:30px;padding:0 12px;font-size:12.5px;color:var(--accent)}
.fine{font-size:12px;color:var(--fg3);margin:12px 2px 0;line-height:1.55}

/* celebration */
.celebrate{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));
  background:radial-gradient(80% 50% at 50% 35%,var(--glow1),transparent 70%),var(--bg);overflow:hidden}
.celebrate .rays{position:absolute;top:35%;left:50%;width:720px;height:720px;margin:-360px 0 0 -360px;background:repeating-conic-gradient(var(--ray) 0 9deg,transparent 9deg 24deg);
  -webkit-mask:radial-gradient(circle,#000 8%,transparent 60%);mask:radial-gradient(circle,#000 8%,transparent 60%);animation:spin 50s linear infinite;pointer-events:none}
.celebrate .bart{--s:132px;animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.3) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.celebrate .bname{font-weight:600;color:var(--fg2);font-size:14px;margin-top:8px;position:relative}
.celebrate h2{margin:22px 0 4px;font-family:var(--display);font-size:30px;font-weight:800;line-height:1.15;position:relative;text-wrap:balance}
.celebrate p{margin:0;color:var(--fg2);font-size:14.5px;max-width:32ch;position:relative}
.celebrate .cta{width:100%;max-width:400px;margin-top:36px;display:flex;flex-direction:column;gap:6px;position:relative}
.celebrate .cta .btn{height:54px;border-radius:27px;font-size:16px}
.celebrate .cta .plain{height:48px;font-weight:600;color:var(--fg)}
.spark{position:absolute;width:8px;height:8px;border-radius:2px;background:var(--gold);opacity:0;animation:spark 1.6s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(260deg)}}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-160%);z-index:60;background:var(--sheet);color:var(--fg);border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);padding:10px 18px;border-radius:22px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);
  transition:transform .45s cubic-bezier(.32,.72,0,1);white-space:nowrap;display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0)}

@media (max-height:720px){.ar{font-size:25px}.num{font-size:54px}.hero{padding:12px 14px}.actions{margin-top:10px}.act i{width:42px;height:42px}}

/* ---- v3: levels, gems, nur, board ---- */
.top .hi,.top .dt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statpill{height:40px;border-radius:20px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

.statpill svg{width:15px;height:15px}
.statpill .sep{width:1px;height:16px;background:var(--stroke)}

.statpill .tm svg{color:var(--accent)}
.lvl{flex:none;margin-top:12px;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:12px;border-radius:24px;padding:10px 14px 10px 10px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--g2) 70%,transparent),color-mix(in srgb,var(--g3) 85%,transparent));border:1px solid color-mix(in srgb,var(--g2) 60%,transparent);color:#fff;transition:background .6s}
.lvl::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);transform:translateX(-100%);animation:sheen 4.5s ease-in-out infinite;pointer-events:none}
@keyframes sheen{60%,100%{transform:translateX(100%)}}
.lvl .lvwrap{position:relative;display:grid;place-items:center}
.lvl .lvtag{position:absolute;top:-4px;inset-inline-start:-4px;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:8px;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:2;white-space:nowrap}
.lvl .lvmain{min-width:0}
.lvl .lvtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lvl .lvtop b{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl .lvtot{flex:none;font-size:11px;font-weight:700;padding:3px 8px;border-radius:9px;background:rgba(255,255,255,.2);white-space:nowrap}
.digits{display:flex;align-items:center;gap:5px;margin-top:6px;direction:ltr;justify-content:flex-start}

.digits span{width:30px;height:38px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.18);font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.digits em{font-style:normal;font-weight:800;opacity:.8}
.lvl.paused .digits span{opacity:.55}
.lvl .lvhint{font-size:11px;opacity:.85;margin-inline-start:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl .lvbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.15)}
.lvl .lvbar i{display:block;height:100%;width:0;background:rgba(255,255,255,.85);transition:width .3s}
html[dir="rtl"] .lvl .lvbar i{margin-inline-start:auto}
.gemhex{--s:54px;width:var(--s);height:calc(var(--s)*1.1);position:relative;display:grid;place-items:center;filter:drop-shadow(0 0 var(--gl,10px) var(--gg))}
.gemhex::before{content:"";position:absolute;inset:0;clip-path:polygon(50% 0,94% 25%,94% 75%,50% 100%,6% 75%,6% 25%);background:linear-gradient(160deg,var(--g1),var(--g2) 45%,var(--g3))}
.gemhex::after{content:"";position:absolute;inset:0;clip-path:polygon(50% 0,94% 25%,50% 50%,6% 25%);background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.08))}
.gemhex i{position:absolute;inset:0;clip-path:polygon(50% 50%,94% 75%,50% 100%);background:rgba(0,0,0,.18)}
.gemhex b{position:absolute;width:24%;height:24%;top:12%;inset-inline-end:16%;z-index:2;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.gemhex.lock{filter:none}.gemhex.lock::before{background:var(--glass2)}.gemhex.lock::after,.gemhex.lock i,.gemhex.lock b{display:none}
.gemhex.lock svg{position:relative;z-index:2;width:40%;height:40%;color:var(--fg3)}
.actrow{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:4px 0 8px}
.actrow .act i{width:44px;height:44px}

/* nur hero */
.nur{position:relative;width:180px;height:180px;margin:0 auto}
.nur .rays{position:absolute;inset:-20px;border-radius:50%;background:repeating-conic-gradient(var(--ng) 0 4deg,transparent 4deg 18deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 66%);mask:radial-gradient(circle,#000 20%,transparent 66%);animation:spin 60s linear infinite;opacity:.7}
.nur .halo{position:absolute;inset:16%;border-radius:50%;background:radial-gradient(circle,var(--ng),transparent 70%);animation:breathe 3.6s ease-in-out infinite}

.nur .ring{position:absolute;inset:6px;border-radius:50%;background:repeating-conic-gradient(var(--gold) 0 1.2deg,transparent 1.2deg 7deg);-webkit-mask:radial-gradient(circle,transparent 63%,#000 64%,#000 67%,transparent 68%);mask:radial-gradient(circle,transparent 63%,#000 64%,#000 67%,transparent 68%);opacity:.5;animation:spin 40s linear infinite reverse}
.nur svg{position:absolute;inset:24%;width:52%;height:52%;filter:drop-shadow(0 0 16px var(--ng))}
.nur svg .glint{animation:twinkle 2.4s ease-in-out infinite;transform-origin:50px 14px}
.sseg{max-width:320px;margin:0 auto 14px}
.goalbar{height:8px;border-radius:4px;background:var(--glass2);overflow:hidden;margin-top:12px}
.goalbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:4px;transition:width .3s}
.goalrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--fg2);margin-top:8px;font-variant-numeric:tabular-nums}
.goalrow b{color:var(--fg);font-size:15px}
.wc.on .dot{background:linear-gradient(160deg,var(--wc1,#FFD98A),var(--wc2,#E8962E));color:#fff;box-shadow:0 4px 12px var(--ng,rgba(232,150,46,.35))}
.wc.l::before,.wc.r::after{background:var(--ng,rgba(232,150,46,.28));opacity:.45}

/* gem picker */
.gems{display:flex;gap:10px;overflow-x:auto;padding:4px 14px 14px;scrollbar-width:none}
.gems::-webkit-scrollbar{display:none}
.gpick{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--fg2);padding:6px 4px;border-radius:14px;border:1.5px solid transparent;min-width:62px}
.gpick.on{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.gpick .gemhex{--s:38px}
.gpick.auto span.ic{width:38px;height:42px;display:grid;place-items:center;color:var(--accent)}
.gpick.auto svg{width:24px;height:24px}

/* board */
.bnote{margin:0 0 12px;font-size:12.5px;color:var(--fg2)}
.podium{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.prow{display:flex;align-items:center;gap:12px;border-radius:24px;padding:12px 14px;border:1px solid var(--stroke);background:var(--hero);position:relative}
.prow.r1{border-color:color-mix(in srgb,#E8B54A 70%,transparent);box-shadow:0 8px 28px rgba(232,181,74,.18)}
.prow.me{outline:2px solid var(--accent);outline-offset:-2px}
.av{position:relative;flex:none;width:52px;height:52px}
.av img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--glass2);display:block}
.av .rk{position:absolute;bottom:-6px;inset-inline-end:-8px;width:26px;height:28px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;
  clip-path:polygon(50% 0,94% 25%,94% 75%,50% 100%,6% 75%,6% 25%);background:linear-gradient(160deg,#B9A7FF,#6E56E8)}
.av .rk.k1{background:linear-gradient(160deg,#FFE29A,#E0A136);color:#4A2E00}
.av .rk.k2{background:linear-gradient(160deg,#F1F4FA,#9FA9BC);color:#2A3242}
.av .rk.k3{background:linear-gradient(160deg,#F7C9A0,#B9733D)}
.prow .nm,.lrow .nm{flex:1;min-width:0}
.prow .nm b,.lrow .nm b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .nm small,.lrow .nm small{display:block;font-size:12px;color:var(--fg2);margin-top:2px}
.score{flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:18px;background:var(--glass2);font-weight:800;font-variant-numeric:tabular-nums}
.score svg{width:16px;height:16px;color:var(--gold)}
.joincard{border-radius:24px;padding:18px;text-align:center;margin-bottom:14px}
.joincard h3{margin:10px 0 4px;font-size:17px;font-weight:700}
.joincard p{margin:0 0 4px;color:var(--fg2);font-size:13.5px}
.joincard .btn{margin-top:12px}
.joincard .gemhex{margin:0 auto}
.celebrate .rwpts{position:relative;margin-top:14px;color:var(--gold);background:var(--gold-soft);border-color:transparent;height:30px;font-size:13px}
.celebrate .rwpts svg{width:14px;height:14px}
.celebrate h2{margin-top:12px}
.rwh{position:relative;width:100%;max-width:420px;margin-top:18px;border-radius:22px;padding:14px 16px;text-align:start;max-height:38vh;overflow:auto}
.rwh b{display:block;margin-top:10px;font-size:14px}
.rwh p{margin:6px 0 8px;color:var(--fg);font-size:14.5px;max-width:none}
.rwh small{color:var(--fg2);font-size:12px}
.celebrate .cta{margin-top:20px}
/* ---- v4: responsive fit, salat, rewards ---- */
.stage{min-height:120px}
button.statpill{cursor:pointer;color:var(--fg)}
#v-count.c1 .mean,#v-count.c1 .virtue{display:none}

@media (max-width:380px){.statpill{padding:0 9px;gap:6px;font-size:12px}.pill-btn{padding:0 10px}.top{gap:8px}.top .hi{font-size:12px}.tab{font-size:10px}}

/* salat strip on counter */

  background:linear-gradient(100deg,#2A3A8C,#4B3A9A);border:1px solid rgba(255,255,255,.14)}

/* salat view */

.stars2{position:absolute!important;inset:0;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 12% 22%,#fff,transparent),radial-gradient(1px 1px at 28% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 46% 18%,#fff,transparent),radial-gradient(1px 1px at 62% 72%,#fff,transparent),radial-gradient(1px 1px at 82% 40%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 82%,#fff,transparent);opacity:.8}
.sal-top{display:flex;align-items:center;justify-content:space-between;gap:10px}

.sal-now{font-family:var(--display);font-size:40px;font-weight:800;margin-top:14px;line-height:1.1}
.sal-sub{font-size:13.5px;opacity:.85;margin-top:2px}
.sal-dg{margin-top:10px}
.sal-dg span{background:rgba(255,255,255,.2);width:34px;height:44px;font-size:24px}
.sal-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin-top:14px;overflow:hidden}

.plist{padding-bottom:6px}
.prow2{display:grid;grid-template-columns:30px 1fr auto 36px;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--stroke)}

const V9={"en": ["Hasanat", "Estimated from your dhikr", "This month", "This year", "How is it counted?", "Every dhikr you say is a good deed, and Allah writes each good deed as ten (Qur’an 6:160; Sahih al-Bukhari 6491), so 1 dhikr = 10 hasanat. This matches Sahih Muslim 2698: 100 SubhanAllah = 1,000 good deeds. It is a minimum: Allah multiplies for whom He wills, and only He knows what is accepted.", "{n} dhikr", "Made with love by {name}", "Thank you for counting your dhikr here. Please remember me, my family and everyone who helped build this app in your duas. May every dhikr you make here be a continuous charity (sadaqah jariyah) for you and for us. JazakAllahu khairan.", "On sadaqah jariyah", "When a person dies, his deeds come to an end except for three: a continuing charity (sadaqah jariyah), knowledge that benefits others, or a righteous child who prays for him."], "bn": ["হাসানাত", "আপনার যিকির থেকে আনুমানিক", "এই মাস", "এই বছর", "কীভাবে গণনা হয়?", "আপনার প্রতিটি যিকির একটি নেক আমল, আর আল্লাহ প্রতিটি নেক আমল দশগুণ করে লেখেন (আল-কুরআন ৬:১৬০; সহিহ বুখারি ৬৪৯১)। তাই ১ বার যিকির = ১০ হাসানাত। এটি সহিহ মুসলিম ২৬৯৮-এর সাথে মিলে যায়: ১০০ বার সুবহানাল্লাহ = ১,০০০ নেকি। এটি সর্বনিম্ন হিসাব; আল্লাহ যাকে ইচ্ছা বহুগুণ বাড়িয়ে দেন, আর কী কবুল হলো তা কেবল তিনিই জানেন।", "{n} বার যিকির", "ভালোবাসা দিয়ে তৈরি করেছেন {name}", "এখানে যিকির করার জন্য আপনাকে ধন্যবাদ। দোয়ায় আমাকে, আমার পরিবারকে এবং এই অ্যাপ তৈরিতে যারা সাহায্য করেছেন সবাইকে স্মরণ রাখবেন। এখানে আপনার প্রতিটি যিকির আপনার ও আমাদের জন্য সদকায়ে জারিয়া হোক। জাযাকাল্লাহু খাইরান।", "সদকায়ে জারিয়া নিয়ে হাদিস", "মানুষ যখন মারা যায়, তখন তার আমল বন্ধ হয়ে যায়, তিনটি ছাড়া: সদকায়ে জারিয়া, এমন জ্ঞান যা দিয়ে মানুষ উপকৃত হয়, অথবা নেক সন্তান যে তার জন্য দোয়া করে।"], "ur": ["حسنات", "آپ کے ذکر سے اندازاً", "اس مہینے", "اس سال", "حساب کیسے ہوتا ہے؟", "آپ کا ہر ذکر ایک نیکی ہے، اور اللہ ہر نیکی کو دس گنا لکھتا ہے (القرآن 6:160؛ صحیح بخاری 6491)، اس لیے 1 ذکر = 10 حسنات۔ یہ صحیح مسلم 2698 سے مطابقت رکھتا ہے: 100 بار سبحان اللہ = 1,000 نیکیاں۔ یہ کم از کم اندازہ ہے؛ اللہ جس کے لیے چاہے بڑھا دیتا ہے، اور کیا قبول ہوا یہ صرف وہی جانتا ہے۔", "{n} ذکر", "{name} نے محبت سے بنایا", "یہاں ذکر کرنے کا شکریہ۔ اپنی دعاؤں میں مجھے، میرے اہلِ خانہ اور اس ایپ کو بنانے میں مدد کرنے والے سب لوگوں کو یاد رکھیں۔ اللہ کرے یہاں آپ کا ہر ذکر آپ کے اور ہمارے لیے صدقۂ جاریہ بنے۔ جزاک اللہ خیراً۔", "صدقۂ جاریہ کے بارے میں حدیث", "جب انسان فوت ہو جاتا ہے تو اس کا عمل منقطع ہو جاتا ہے سوائے تین چیزوں کے: صدقۂ جاریہ، ایسا علم جس سے فائدہ اٹھایا جائے، یا نیک اولاد جو اس کے لیے دعا کرے۔"], "hi": ["हसनात", "आपके ज़िक्र से अनुमानित", "इस महीने", "इस साल", "गिनती कैसे होती है?", "आपका हर ज़िक्र एक नेकी है, और अल्लाह हर नेकी को दस गुना लिखता है (क़ुरआन 6:160; सहीह बुख़ारी 6491), इसलिए 1 ज़िक्र = 10 हसनात। यह सहीह मुस्लिम 2698 से मेल खाता है: 100 बार सुब्हानअल्लाह = 1,000 नेकियाँ। यह न्यूनतम अनुमान है; अल्लाह जिसके लिए चाहे बढ़ा देता है, और क्या क़बूल हुआ यह सिर्फ़ वही जानता है।", "{n} ज़िक्र", "{name} ने मोहब्बत से बनाया", "यहाँ ज़िक्र करने के लिए शुक्रिया। अपनी दुआओं में मुझे, मेरे परिवार को और इस ऐप को बनाने में मदद करने वाले सभी लोगों को याद रखें। अल्लाह करे यहाँ आपका हर ज़िक्र आपके और हमारे लिए सदक़ा-ए-जारिया बने। जज़ाकल्लाहु ख़ैरन।", "सदक़ा-ए-जारिया पर हदीस", "जब इंसान मर जाता है तो उसका अमल ख़त्म हो जाता है, सिवाय तीन के: सदक़ा-ए-जारिया, ऐसा इल्म जिससे फ़ायदा उठाया जाए, या नेक औलाद जो उसके लिए दुआ करे।"], "fil": ["Hasanat", "Tantiya mula sa iyong dhikr", "Ngayong buwan", "Ngayong taon", "Paano ito binibilang?", "Bawat dhikr na sinasabi mo ay isang mabuting gawa, at isinusulat ng Allah ang bawat mabuting gawa nang sampu (Qur’an 6:160; Sahih al-Bukhari 6491), kaya 1 dhikr = 10 hasanat. Tugma ito sa Sahih Muslim 2698: 100 SubhanAllah = 1,000 mabuting gawa. Ito ang pinakamababa: pinararami ng Allah para sa sinumang Kanyang naisin, at Siya lamang ang nakaaalam kung ano ang tinatanggap.", "{n} dhikr", "Ginawa nang may pagmamahal ni {name}", "Salamat sa pagbibilang ng iyong dhikr dito. Pakisama ako, ang aking pamilya, at lahat ng tumulong sa paggawa ng app na ito sa iyong mga du’a. Nawa’y ang bawat dhikr mo rito ay maging sadaqah jariyah para sa iyo at sa amin. JazakAllahu khairan.", "Tungkol sa sadaqah jariyah", "Kapag namatay ang tao, natatapos ang kanyang mga gawa maliban sa tatlo: patuloy na kawanggawa (sadaqah jariyah), kaalamang pinakikinabangan, o mabuting anak na nananalangin para sa kanya."], "pt": ["Hasanat", "Estimativa a partir do seu dhikr", "Este mês", "Este ano", "Como é contado?", "Cada dhikr que você faz é uma boa ação, e Allah registra cada boa ação como dez (Alcorão 6:160; Sahih al-Bukhari 6491), então 1 dhikr = 10 hasanat. Isso está de acordo com Sahih Muslim 2698: 100 SubhanAllah = 1.000 boas ações. É um mínimo: Allah multiplica para quem Ele quer, e só Ele sabe o que é aceito.", "{n} dhikr", "Feito com carinho por {name}", "Obrigado por contar seu dhikr aqui. Lembre-se de mim, da minha família e de todos que ajudaram a criar este app em suas duas. Que cada dhikr que você fizer aqui seja uma caridade contínua (sadaqah jariyah) para você e para nós. JazakAllahu khairan.", "Sobre a sadaqah jariyah", "Quando a pessoa morre, suas obras cessam, exceto três: uma caridade contínua (sadaqah jariyah), um conhecimento do qual se tira proveito, ou um filho virtuoso que suplica por ela."], "es": ["Hasanat", "Estimado a partir de tu dhikr", "Este mes", "Este año", "¿Cómo se cuenta?", "Cada dhikr que decís es una buena obra, y Allah escribe cada buena obra como diez (Corán 6:160; Sahih al-Bujari 6491), así que 1 dhikr = 10 hasanat. Coincide con Sahih Muslim 2698: 100 SubhanAllah = 1.000 buenas obras. Es un mínimo: Allah multiplica para quien Él quiere, y solo Él sabe qué es aceptado.", "{n} dhikr", "Hecho con cariño por {name}", "Gracias por contar tu dhikr acá. Acordate de mí, de mi familia y de todos los que ayudaron a crear esta app en tus duas. Que cada dhikr que hagas acá sea una caridad continua (sadaqah jariyah) para vos y para nosotros. JazakAllahu khairan.", "Sobre la sadaqah jariyah", "Cuando una persona muere, sus obras se terminan, excepto tres: una caridad continua (sadaqah jariyah), un conocimiento del que se saca provecho, o un hijo virtuoso que suplica por ella."], "zh": ["善功", "根据你的赞念估算", "本月", "今年", "如何计算？", "你的每一次赞念都是一件善功，而真主把每件善功记为十倍（《古兰经》6:160；《布哈里圣训实录》6491），所以 1 次赞念 = 10 份善功。这与《穆斯林圣训实录》2698 相符：100 次“赞主清净” = 1,000 件善功。这只是最低估算：真主为祂所意欲者加倍，唯有祂知道什么被接受。", "{n} 次赞念", "由 {name} 用心打造", "感谢你在这里记录赞念。请在你的祈祷中记念我、我的家人以及所有帮助打造这个应用的人。愿你在这里的每一次赞念都成为你我长流的施舍（索德格·贾里耶）。愿真主以最好的回赐你。", "关于长流的施舍", "人死之后，他的功修就中断了，唯有三件除外：长流的施舍、有益于人的知识，或为他祈祷的清廉子女。"], "ja": ["ハサナート", "ズィクルからの推定", "今月", "今年", "どう数えるの？", "あなたのズィクル一つひとつは善行であり、アッラーは一つの善行を十倍として記録されます（クルアーン6:160、サヒーフ・ブハーリー6491）。つまりズィクル1回＝10ハサナートです。これはサヒーフ・ムスリム2698（スブハーナッラー100回＝善行1,000）とも一致します。これは最低限の目安であり、アッラーは御望みの者に何倍にも増やされ、何が受け入れられたかを知るのはアッラーのみです。", "ズィクル{n}回", "{name} が心を込めて制作", "ここでズィクルを数えてくださり、ありがとうございます。どうかドゥアーの中で、私と私の家族、そしてこのアプリ作りを手伝ってくれたすべての人を思い出してください。ここでのあなたのズィクル一つひとつが、あなたと私たちにとってのサダカ・ジャーリヤ（継続する施し）となりますように。ジャザーカッラーフ・ハイラン。", "サダカ・ジャーリヤについて", "人が死ぬと、その行いは途絶える。ただし三つを除いて：継続する施し（サダカ・ジャーリヤ）、人々が恩恵を受ける知識、あるいは彼のために祈る正しい子供である。"], "id": ["Hasanat", "Perkiraan dari zikir Anda", "Bulan ini", "Tahun ini", "Bagaimana cara menghitungnya?", "Setiap zikir yang Anda ucapkan adalah satu kebaikan, dan Allah mencatat setiap kebaikan sepuluh kali lipat (Al-Qur’an 6:160; Sahih al-Bukhari 6491), jadi 1 zikir = 10 hasanat. Ini sesuai dengan Sahih Muslim 2698: 100 kali Subhanallah = 1.000 kebaikan. Ini perkiraan minimum; Allah melipatgandakan bagi siapa yang Dia kehendaki, dan hanya Dia yang tahu apa yang diterima.", "{n} zikir", "Dibuat dengan cinta oleh {name}", "Terima kasih telah menghitung zikir Anda di sini. Mohon ingat saya, keluarga saya, dan semua yang membantu membuat aplikasi ini dalam doa Anda. Semoga setiap zikir Anda di sini menjadi sedekah jariyah bagi Anda dan bagi kami. Jazakallahu khairan.", "Tentang sedekah jariyah", "Apabila manusia meninggal dunia, terputuslah amalnya kecuali tiga perkara: sedekah jariyah, ilmu yang bermanfaat, atau anak saleh yang mendoakannya."], "ar": ["الحسنات", "تقدير من ذكرك", "هذا الشهر", "هذه السنة", "كيف تُحسب؟", "كل ذكر تقوله حسنة، والله يكتب الحسنة بعشر أمثالها (الأنعام ١٦٠؛ صحيح البخاري ٦٤٩١)، فالذكر الواحد = ١٠ حسنات. وهذا يوافق صحيح مسلم ٢٦٩٨: مئة تسبيحة = ألف حسنة. وهذا هو الحد الأدنى؛ والله يضاعف لمن يشاء، وهو وحده أعلم بما يُقبل.", "{n} ذكر", "صنعه بحب: {name}", "شكرًا لك على ذكرك هنا. لا تنسَني وأهلي وكلَّ من ساعد في بناء هذا التطبيق من دعائك. جعل الله كل ذكرٍ تذكره هنا صدقةً جاريةً لك ولنا. جزاك الله خيرًا.", "حديث في الصدقة الجارية", ""], "fr": ["Hasanat", "Estimation à partir de votre dhikr", "Ce mois-ci", "Cette année", "Comment est-ce calculé ?", "Chaque dhikr que vous dites est une bonne action, et Allah inscrit chaque bonne action comme dix (Coran 6:160 ; Sahih al-Bukhari 6491), donc 1 dhikr = 10 hasanat. Cela correspond à Sahih Muslim 2698 : 100 SubhanAllah = 1 000 bonnes actions. C’est un minimum : Allah multiplie pour qui Il veut, et Lui seul sait ce qui est accepté.", "{n} dhikr", "Fait avec amour par {name}", "Merci de compter votre dhikr ici. Pensez à moi, à ma famille et à tous ceux qui ont aidé à créer cette application dans vos invocations. Qu’Allah fasse de chaque dhikr que vous faites ici une aumône continue (sadaqah jariyah) pour vous et pour nous. JazakAllahu khairan.", "Sur la sadaqah jariyah", "Lorsque l’homme meurt, ses œuvres s’interrompent, sauf trois : une aumône continue (sadaqah jariyah), une science dont on tire profit, ou un enfant pieux qui invoque pour lui."]};

ुलिल्लाह” कहा। अल्हम्दुलिल्लाह तराज़ू को भर देता है।"], "fil": ["Tagapuno ng Timbangan", "Sinabi ang “Alhamdulillah” nang 1,000 beses. Pinupuno ng Alhamdulillah ang timbangan."], "pt": ["Aquele que Enche a Balança", "Disse “Alhamdulillah” 1.000 vezes. Alhamdulillah enche a balança."], "es": ["El que Llena la Balanza", "Dijiste “Alhamdulillah” 1.000 veces. Alhamdulillah llena la balanza."], "zh": ["充满天秤者", "念“一切赞颂归真主”1,000 次。“一切赞颂归真主”充满天秤。"], "ja": ["秤を満たす者", "「アルハムドゥリッラー」を1,000回唱えた。アルハムドゥリッラーは秤を満たす。"], "id": ["Pemenuh Timbangan", "Membaca “Alhamdulillah” 1.000 kali. Alhamdulillah memenuhi timbangan."], "ar": ["مالئ الميزان", "قال «الحمد لله» ألف مرة، والحمد لله تملأ الميزان."], "fr": ["Celui qui remplit la balance", "A dit « Alhamdulillah » 1 000 fois. Alhamdulillah remplit la balance."]}, "kalimatan": {"en": ["Keeper of the Two Words", "Said “SubhanAllahi wa bihamdihi, SubhanAllahil Azim” 100 times: two words light on the tongue, heavy on the scale, beloved to Ar-Rahman."], "bn": ["দুই কালিমার ধারক", "১০০ বার “সুবহানাল্লাহি ওয়া বিহামদিহি, সুবহানাল্লাহিল আজিম” পড়েছেন: জিহ্বায় হালকা, পাল্লায় ভারী, রহমানের প্রিয় দুটি কালিমা।"], "ur": ["دو کلموں والا", "100 بار “سبحان اللہ وبحمدہ، سبحان اللہ العظیم” پڑھا: زبان پر ہلکے، میزان میں بھاری، رحمٰن کو محبوب دو کلمے۔"], "hi": ["दो कलिमों वाला", "100 बार “सुब्हानअल्लाहि व बिहम्दिही, सुब्हानअल्लाहिल अज़ीम” पढ़ा: ज़बान पर हल्के, तराज़ू में भारी, रहमान को प्यारे दो कलिमे।"], "fil": ["Tagapag-ingat ng Dalawang Salita", "Sinabi ang “SubhanAllahi wa bihamdihi, SubhanAllahil Azim” nang 100 beses: dalawang salitang magaan sa dila, mabigat sa timbangan, at minamahal ni Ar-Rahman."], "pt": ["Guardião das Duas Palavras", "Disse “SubhanAllahi wa bihamdihi, SubhanAllahil Azim” 100 vezes: duas palavras leves na língua, pesadas na balança e amadas por Ar-Rahman."], "es": ["Guardián de las Dos Palabras", "Dijiste “SubhanAllahi wa bihamdihi, SubhanAllahil Azim” 100 veces: dos palabras ligeras en la lengua, pesadas en la balanza y amadas por Ar-Rahman."], "zh": ["两句话的守护者", "念“赞主清净，赞美归主；赞伟大的主清净”100 次：舌上轻、秤上重、为至仁主所喜爱的两句话。"], "ja": ["二つの言葉を守る者", "「スブハーナッラーヒ・ワ・ビハムディヒ、スブハーナッラーヒル・アズィーム」を100回唱えた。舌に軽く、秤に重く、慈悲深き御方に愛される二つの言葉。"], "id": ["Penjaga Dua Kalimat", "Membaca “Subhanallahi wa bihamdihi, Subhanallahil ‘Azhim” 100 kali: dua kalimat ringan di lisan, berat di timbangan, dicintai Ar-Rahman."], "ar": ["صاحب الكلمتين", "قال «سبحان الله وبحمده، سبحان الله العظيم» مئة مرة: كلمتان خفيفتان على اللسان، ثقيلتان في الميزان، حبيبتان إلى الرحمن."], "fr": ["Gardien des deux paroles", "A dit « SubhanAllahi wa bihamdihi, SubhanAllahil Azim » 100 fois : deux paroles légères sur la langue, lourdes dans la balance, aimées du Tout Miséricordieux."]}, "muhibb": {"en": ["Lover of the Prophet ﷺ", "Sent salawat on the Prophet ﷺ 1,000 times. For each one, Allah sends ten blessings."], "bn": ["নবীপ্রেমী ﷺ", "নবী ﷺ-এর ওপর ১,০০০ বার দরুদ পাঠিয়েছেন। প্রতিটির বিনিময়ে আল্লাহ দশটি রহমত পাঠান।"], "ur": ["محبِ رسول ﷺ", "نبی ﷺ پر 1,000 بار درود بھیجا۔ ہر ایک کے بدلے اللہ دس رحمتیں بھیجتا ہے۔"], "hi": ["नबी ﷺ से मोहब्बत करने वाला", "नबी ﷺ पर 1,000 बार दुरूद भेजा। हर एक के बदले अल्लाह दस रहमतें भेजता है।"], "fil": ["Nagmamahal sa Propeta ﷺ", "Nagpadala ng salawat sa Propeta ﷺ nang 1,000 beses. Sa bawat isa, nagpapadala ang Allah ng sampung pagpapala."], "pt": ["Amante do Profeta ﷺ", "Enviou salawat ao Profeta ﷺ 1.000 vezes. Para cada uma, Allah envia dez bênçãos."], "es": ["Amante del Profeta ﷺ", "Enviaste salawat al Profeta ﷺ 1.000 veces. Por cada una, Allah envía diez bendiciones."], "zh": ["敬爱先知者 ﷺ", "为先知 ﷺ 祝福 1,000 次。每祝福一次，真主赐他十次恩惠。"], "ja": ["預言者ﷺを愛する者", "預言者ﷺへのサラワートを1,000回唱えた。一回ごとにアッラーは十の祝福を授けられる。"], "id": ["Pecinta Nabi ﷺ", "Bershalawat kepada Nabi ﷺ 1.000 kali. Untuk setiap shalawat, Allah memberi sepuluh rahmat."], "ar": ["مُحِبّ النبي ﷺ", "صلّى على النبي ﷺ ألف مرة، ومن صلّى عليه واحدة صلّى الله عليه بها عشرًا."], "fr": ["Amoureux du Prophète ﷺ", "A prié sur le Prophète ﷺ 1 000 fois. Pour chacune, Allah accorde dix bénédictions."]}, "nida": {"en": ["Caller in the Darkness", "Made the du‘a of Yunus (AS) 100 times. No Muslim makes it except that Allah answers him."], "bn": ["অন্ধকারে আহ্বানকারী", "১০০ বার ইউনুস (আ.)-এর দোয়া পড়েছেন। কোনো মুসলিম এ দোয়া করলে আল্লাহ তা কবুল করেন।"], "ur": ["اندھیروں میں پکارنے والا", "100 بار حضرت یونس علیہ السلام کی دعا پڑھی۔ جو مسلمان یہ دعا کرے، اللہ اسے قبول فرماتا ہے۔"], "hi": ["अँधेरों में पुकारने वाला", "100 बार हज़रत यूनुस (अ.) की दुआ पढ़ी। जो मुसलमान यह दुआ करे, अल्लाह उसे क़बूल करता है।"], "fil": ["Tumatawag sa Kadiliman", "Binigkas ang du‘a ni Yunus (AS) nang 100 beses. Walang Muslim na bumibigkas nito na hindi sinasagot ng Allah."], "pt": ["Aquele que Clama na Escuridão", "Fez a du‘a de Yunus (AS) 100 vezes. Nenhum muçulmano a faz sem que Allah lhe responda."], "es": ["El que Clama en la Oscuridad", "Hiciste la du‘a de Yunus (AS) 100 veces. Ningún musulmán la hace sin que Allah le responda."], "zh": ["黑暗中的呼求者", "念尤努斯（愿主赐他平安）的祈祷 100 次。任何穆斯林以此祈求，真主都会应答他。"], "ja": ["闇の中で呼ぶ者", "ユーヌス（彼に平安あれ）のドゥアーを100回唱えた。これを唱えるムスリムに、アッラーは必ず応えられる。"], "id": ["Penyeru dalam Kegelapan", "Membaca doa Nabi Yunus (AS) 100 kali. Tidaklah seorang Muslim berdoa dengannya kecuali Allah mengabulkannya."], "ar": ["صاحب النداء", "دعا بدعوة ذي النون مئة مرة، ولم يدعُ بها مسلم في شيء قطّ إلا استجاب الله له."], "fr": ["Celui qui appelle dans les ténèbres", "A fait l’invocation de Yunus (AS) 100 fois. Aucun musulman ne la fait sans qu’Allah ne lui réponde."]}, "dhakir": {"en": ["One Who Remembers Allah Often", "Reached 50,000 dhikr. For the men and women who remember Allah often, Allah has prepared forgiveness and a great reward."], "bn": ["অধিক যিকিরকারী", "৫০,০০০ যিকির পূর্ণ করেছেন। যারা আল্লাহকে বেশি স্মরণ করে, আল্লাহ তাদের জন্য ক্ষমা ও মহাপুরস্কার প্রস্তুত রেখেছেন।"], "ur": ["کثرت سے ذکر کرنے والا", "50,000 ذکر مکمل کیے۔ اللہ کو کثرت سے یاد کرنے والے مردوں اور عورتوں کے لیے اللہ نے مغفرت اور اجرِ عظیم تیار کر رکھا ہے۔"], "hi": ["बहुत ज़िक्र करने वाला", "50,000 ज़िक्र पूरे किए। अल्लाह क is que j’accomplisse assidûment la prière. »"]}, "mudawim": {"en": ["The Consistent", "Kept a 40-day dhikr streak. The most beloved deeds to Allah are those done regularly, even if small."], "bn": ["নিয়মিত আমলকারী", "টানা ৪০ দিনের যিকির স্ট্রিক রেখেছেন। আল্লাহর কাছে সবচেয়ে প্রিয় আমল হলো যা নিয়মিত করা হয়, যদিও তা অল্প।"], "ur": ["پابندی کرنے والا", "40 دن کا ذکر کا تسلسل قائم رکھا۔ اللہ کو سب سے محبوب عمل وہ ہے جو پابندی سے کیا جائے، چاہے تھوڑا ہو۔"], "hi": ["पाबंदी करने वाला", "40 दिन की ज़िक्र स्ट्रीक बनाए रखी। अल्लाह को सबसे प्यारा अमल वह है जो पाबंदी से किया जाए, चाहे थोड़ा हो।"], "fil": ["Ang Matiyaga", "Nagpanatili ng 40 araw na dhikr streak. Ang pinakamamahal na gawa sa Allah ay ang palagian, kahit kaunti."], "pt": ["O Constante", "Manteve uma sequência de 40 dias de dhikr. As ações mais amadas por Allah são as constantes, ainda que pequenas."], "es": ["El Constante", "Mantuviste una racha de 40 días de dhikr. Las obras más amadas por Allah son las constantes, aunque sean pocas."], "zh": ["坚持不懈者", "保持了 40 天的赞念连续。真主最喜爱的善功是持之以恒的，哪怕很少。"], "ja": ["継続する者", "40日連続でズィクルを続けた。アッラーが最も愛される行いは、たとえ少なくとも継続されるものである。"], "id": ["Yang Istikamah", "Menjaga zikir 40 hari berturut-turut. Amalan yang paling dicintai Allah adalah yang rutin walaupun sedikit."], "ar": ["المُداوِم", "حافظ على الذكر أربعين يومًا متتالية، وأحبّ الأعمال إلى الله أدومها وإن قلّ."], "fr": ["Le Constant", "A tenu une série de 40 jours de dhikr. Les œuvres les plus aimées d’Allah sont les plus régulières, même si elles sont peu nombreuses."]}};
